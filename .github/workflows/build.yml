          # 12. SettingsActivity.java
          cat << 'EOF' > app/src/main/java/com/astral/browser/SettingsActivity.java
          package com.astral.browser;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.SwitchCompat;

          public class SettingsActivity extends AppCompatActivity {

              private SharedPreferences prefs;

              private RadioGroup rgSearchEngine, rgDns;
              private RadioButton rbDuck, rbBrave, rbStartpage;
              private RadioButton rbDnsDefault, rbDnsAdguard, rbDnsCloudflare;
              private SwitchCompat switchProxy;
              private EditText etProxyHost, etProxyPort;
              private SwitchCompat switchBlockThirdParty;
              private SwitchCompat switchBlockImages;
              private SwitchCompat switchAutoPurge;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_settings);

                  prefs = getSharedPreferences("astral_settings", MODE_PRIVATE);

                  rgSearchEngine = findViewById(R.id.rgSearchEngine);
                  rbDuck = findViewById(R.id.rbDuck);
                  rbBrave = findViewById(R.id.rbBrave);
                  rbStartpage = findViewById(R.id.rbStartpage);

                  rgDns = findViewById(R.id.rgDns);
                  rbDnsDefault = findViewById(R.id.rbDnsDefault);
                  rbDnsAdguard = findViewById(R.id.rbDnsAdguard);
                  rbDnsCloudflare = findViewById(R.id.rbDnsCloudflare);

                  switchProxy = findViewById(R.id.switchProxy);
                  etProxyHost = findViewById(R.id.etProxyHost);
                  etProxyPort = findViewById(R.id.etProxyPort);

                  switchBlockThirdParty = findViewById(R.id.switchBlockThirdParty);
                  switchBlockImages = findViewById(R.id.switchBlockImages);
                  switchAutoPurge = findViewById(R.id.switchAutoPurge);

                  Button btnBackSettings = findViewById(R.id.btnBackSettings);
                  Button btnSaveSettings = findViewById(R.id.btnSaveSettings);

                  cargarValores();

                  btnBackSettings.setOnClickListener(v -> finish());
                  btnSaveSettings.setOnClickListener(v -> guardarValores());
              }

              private void cargarValores() {
                  int engine = prefs.getInt("search_engine", 1);
                  if (engine == 0) rbDuck.setChecked(true);
                  else if (engine == 2) rbStartpage.setChecked(true);
                  else rbBrave.setChecked(true);

                  int dnsOption = prefs.getInt("dns_option", 1);
                  if (dnsOption == 0) rbDnsDefault.setChecked(true);
                  else if (dnsOption == 2) rbDnsCloudflare.setChecked(true);
                  else rbDnsAdguard.setChecked(true);

                  boolean proxyEnabled = prefs.getBoolean("proxy_enabled", false);
                  switchProxy.setChecked(proxyEnabled);
                  etProxyHost.setText(prefs.getString("proxy_host", ""));
                  etProxyPort.setText(prefs.getString("proxy_port", ""));

                  switchBlockThirdParty.setChecked(prefs.getBoolean("block_third_party", true));
                  switchBlockImages.setChecked(prefs.getBoolean("block_images", false));
                  switchAutoPurge.setChecked(prefs.getBoolean("auto_purge", true));
              }

              private void guardarValores() {
                  int engine = 1;
                  if (rbDuck.isChecked()) engine = 0;
                  else if (rbStartpage.isChecked()) engine = 2;

                  int dnsOption = 1;
                  if (rbDnsDefault.isChecked()) dnsOption = 0;
                  else if (rbDnsCloudflare.isChecked()) dnsOption = 2;

                  boolean proxyEnabled = switchProxy.isChecked();
                  String host = etProxyHost.getText().toString().trim();
                  String port = etProxyPort.getText().toString().trim();

                  prefs.edit()
                          .putInt("search_engine", engine)
                          .putInt("dns_option", dnsOption)
                          .putBoolean("proxy_enabled", proxyEnabled)
                          .putString("proxy_host", host)
                          .putString("proxy_port", port)
                          .putBoolean("block_third_party", switchBlockThirdParty.isChecked())
                          .putBoolean("block_images", switchBlockImages.isChecked())
                          .putBoolean("auto_purge", switchAutoPurge.isChecked())
                          .apply();

                  Toast.makeText(this, "Escudos y conexion actualizados", Toast.LENGTH_SHORT).show();
                  finish();
              }
          }
          EOF

          # 13. MainActivity.java con Miku animada y aplicacion de Escudos/Proxy
          cat << 'EOF' > app/src/main/java/com/astral/browser/MainActivity.java
          package com.astral.browser;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.Animation;
          import android.view.animation.AnimationUtils;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.File;
          import java.io.InputStream;
          import java.io.UnsupportedEncodingException;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private FrameLayout webContainer;
              private LinearLayout topBar;
              private LinearLayout homeOverlay;
              private ImageView ivMiku;
              private EditText etUrl;
              private ProgressBar progressBar;
              private Button btnTabs;
              private Button btnIncognito;
              private Button btnSettings;
              private TextView tvEngineInfo;

              private final List<WebView> tabList = new ArrayList<>();
              private int currentTabIndex = 0;
              private boolean isIncognitoActive = false;

              private SharedPreferences prefs;
              private String searchEngineUrl = "https://search.brave.com/search?q=";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("astral_settings", MODE_PRIVATE);

                  webContainer = findViewById(R.id.webContainer);
                  homeOverlay = findViewById(R.id.homeOverlay);
                  ivMiku = findViewById(R.id.ivMiku);
                  topBar = findViewById(R.id.topBar);
                  etUrl = findViewById(R.id.etUrl);
                  progressBar = findViewById(R.id.progressBar);
                  btnTabs = findViewById(R.id.btnTabs);
                  btnIncognito = findViewById(R.id.btnIncognito);
                  btnSettings = findViewById(R.id.btnSettings);
                  tvEngineInfo = findViewById(R.id.tvEngineInfo);

                  Button btnBack = findViewById(R.id.btnBack);
                  Button btnForward = findViewById(R.id.btnForward);
                  Button btnRefresh = findViewById(R.id.btnRefresh);
                  Button btnBurn = findViewById(R.id.btnBurn);

                  actualizarAjustesDeRed();
                  iniciarMikuAnimada();
                  crearNuevaPestana("");

                  btnBack.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoBack()) wv.goBack();
                  });

                  btnForward.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoForward()) wv.goForward();
                  });

                  btnRefresh.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null) wv.reload();
                  });

                  btnIncognito.setOnClickListener(v -> toggleIncognito());

                  btnSettings.setOnClickListener(v -> {
                      Intent intent = new Intent(MainActivity.this, SettingsActivity.class);
                      startActivity(intent);
                  });

                  btnTabs.setOnClickListener(v -> mostrarDialogoPestanas());

                  etUrl.setOnEditorActionListener((TextView v, int actionId, KeyEvent event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_SEARCH ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          navegarDesdeInput();
                          return true;
                      }
                      return false;
                  });

                  btnBurn.setOnClickListener(v -> purgaTotal());
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  actualizarAjustesDeRed();
                  WebView wv = getCurrentWebView();
                  if (wv != null) {
                      aplicarPreferenciasWebView(wv);
                  }
              }

              private void actualizarAjustesDeRed() {
                  int engineIdx = prefs.getInt("search_engine", 1);
                  if (engineIdx == 0) {
                      searchEngineUrl = "https://duckduckgo.com/?q=";
                      tvEngineInfo.setText("Motor: DuckDuckGo • Escudos Activos");
                  } else if (engineIdx == 2) {
                      searchEngineUrl = "https://www.startpage.com/sp/search?query=";
                      tvEngineInfo.setText("Motor: Startpage • Privacidad Total");
                  } else {
                      searchEngineUrl = "https://search.brave.com/search?q=";
                      tvEngineInfo.setText("Motor: Brave Search • Cero Rastreo");
                  }

                  boolean proxyEnabled = prefs.getBoolean("proxy_enabled", false);
                  String host = prefs.getString("proxy_host", "");
                  String port = prefs.getString("proxy_port", "");
                  if (proxyEnabled && !host.isEmpty() && !port.isEmpty()) {
                      System.setProperty("http.proxyHost", host);
                      System.setProperty("http.proxyPort", port);
                      System.setProperty("https.proxyHost", host);
                      System.setProperty("https.proxyPort", port);
                  } else {
                      System.clearProperty("http.proxyHost");
                      System.clearProperty("http.proxyPort");
                      System.clearProperty("https.proxyHost");
                      System.clearProperty("https.proxyPort");
                  }
              }

              private void iniciarMikuAnimada() {
                  Animation floatAnim = AnimationUtils.loadAnimation(this, R.anim.floating_anim);
                  ivMiku.startAnimation(floatAnim);

                  // Intentar cargar imagen Miku descargada o avatar en segundo plano
                  new Thread(() -> {
                      try {
                          URL url = new URL("https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0");
                          conn.setDoInput(true);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          final Bitmap bm = BitmapFactory.decodeStream(is);
                          if (bm != null) {
                              runOnUiThread(() -> ivMiku.setImageBitmap(bm));
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              private void toggleIncognito() {
                  isIncognitoActive = !isIncognitoActive;
                  WebView wv = getCurrentWebView();

                  if (isIncognitoActive) {
                      btnIncognito.setText(R.string.btn_incognito_on);
                      btnIncognito.setTextColor(Color.parseColor("#A855F7"));
                      topBar.setBackgroundColor(Color.parseColor("#1F0A2E"));
                      aplicarAjustesIncognito(wv, true);
                      Toast.makeText(this, "🕶️ Incognito ACTIVO: Cookies bloqueadas al 100%", Toast.LENGTH_SHORT).show();
                  } else {
                      btnIncognito.setText(R.string.btn_incognito_off);
                      btnIncognito.setTextColor(Color.parseColor("#94A3B8"));
                      topBar.setBackgroundColor(Color.parseColor("#110B1F"));
                      aplicarAjustesIncognito(wv, false);
                      Toast.makeText(this, "Modo privado estandar", Toast.LENGTH_SHORT).show();
                  }
                  if (wv != null && wv.getUrl() != null && !wv.getUrl().isEmpty()) {
                      wv.reload();
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void aplicarPreferenciasWebView(WebView wv) {
                  if (wv == null) return;
                  WebSettings settings = wv.getSettings();
                  boolean blockImages = prefs.getBoolean("block_images", false);
                  settings.setLoadsImagesAutomatically(!blockImages);
                  settings.setBlockNetworkImage(blockImages);

                  boolean blockThirdParty = prefs.getBoolean("block_third_party", true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, !blockThirdParty);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void aplicarAjustesIncognito(WebView wv, boolean incognito) {
                  if (wv == null) return;
                  WebSettings settings = wv.getSettings();
                  CookieManager cookieManager = CookieManager.getInstance();

                  if (incognito) {
                      settings.setDomStorageEnabled(false);
                      settings.setDatabaseEnabled(false);
                      settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                      cookieManager.setAcceptCookie(false);
                      cookieManager.setAcceptThirdPartyCookies(wv, false);
                      wv.clearCache(true);
                  } else {
                      settings.setDomStorageEnabled(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      cookieManager.setAcceptCookie(true);
                      boolean blockThirdParty = prefs.getBoolean("block_third_party", true);
                      cookieManager.setAcceptThirdPartyCookies(wv, !blockThirdParty);
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private WebView crearNuevaPestana(String url) {
                  WebView wv = new WebView(this);
                  wv.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings settings = wv.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setSaveFormData(false);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  aplicarPreferenciasWebView(wv);
                  aplicarAjustesIncognito(wv, isIncognitoActive);

                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (view == getCurrentWebView()) {
                              if (newProgress < 100) {
                                  progressBar.setVisibility(View.VISIBLE);
                                  progressBar.setProgress(newProgress);
                              } else {
                                  progressBar.setVisibility(View.GONE);
                              }
                          }
                      }
                  });

                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String startUrl, Bitmap favicon) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(startUrl);
                              homeOverlay.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String endUrl) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(endUrl);
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });

                  if (url != null && !url.isEmpty()) {
                      wv.loadUrl(url);
                  }

                  tabList.add(wv);
                  cambiarAPestana(tabList.size() - 1);
                  return wv;
              }

              private void cambiarAPestana(int index) {
                  if (index < 0 || index >= tabList.size()) return;
                  currentTabIndex = index;
                  webContainer.removeAllViews();
                  WebView current = tabList.get(currentTabIndex);
                  webContainer.addView(current);

                  String currentUrl = current.getUrl();
                  if (currentUrl == null || currentUrl.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                  } else {
                      homeOverlay.setVisibility(View.GONE);
                      etUrl.setText(currentUrl);
                  }
                  btnTabs.setText(String.valueOf(tabList.size()));
              }

              private void cerrarPestana(int index) {
                  if (tabList.size() <= 1) {
                      purgaTotal();
                      return;
                  }
                  WebView wv = tabList.remove(index);
                  wv.clearCache(true);
                  wv.destroy();

                  if (currentTabIndex >= tabList.size()) {
                      currentTabIndex = tabList.size() - 1;
                  }
                  cambiarAPestana(currentTabIndex);
              }

              private void mostrarDialogoPestanas() {
                  List<String> items = new ArrayList<>();
                  for (int i = 0; i < tabList.size(); i++) {
                      String url = tabList.get(i).getUrl();
                      items.add("Pestana " + (i + 1) + ": " + (url != null && !url.isEmpty() ? url : "Inicio Miku"));
                  }
                  items.add("➕ Abrir nueva pestana");

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Pestanas Privadas");
                  builder.setItems(items.toArray(new String[0]), (dialog, which) -> {
                      if (which == tabList.size()) {
                          crearNuevaPestana("");
                      } else {
                          cambiarAPestana(which);
                      }
                  });
                  builder.setNeutralButton("Cerrar pestana actual", (dialog, which) -> cerrarPestana(currentTabIndex));
                  builder.show();
              }

              private WebView getCurrentWebView() {
                  if (currentTabIndex >= 0 && currentTabIndex < tabList.size()) {
                      return tabList.get(currentTabIndex);
                  }
                  return null;
              }

              private void navegarDesdeInput() {
                  String input = etUrl.getText().toString().trim();
                  hideKeyboard();
                  WebView wv = getCurrentWebView();
                  if (wv == null) return;

                  if (input.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      return;
                  }

                  homeOverlay.setVisibility(View.GONE);

                  if (input.startsWith("http://") || input.startsWith("https://")) {
                      wv.loadUrl(input);
                  } else if (input.contains(".") && !input.contains(" ")) {
                      wv.loadUrl("https://" + input);
                  } else {
                      try {
                          String query = URLEncoder.encode(input, "UTF-8");
                          wv.loadUrl(searchEngineUrl + query);
                      } catch (UnsupportedEncodingException e) {
                          wv.loadUrl(searchEngineUrl + input);
                      }
                  }
              }

              private void purgaTotal() {
                  for (WebView wv : tabList) {
                      wv.clearCache(true);
                      wv.clearHistory();
                      wv.destroy();
                  }
                  tabList.clear();
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  crearNuevaPestana("");
                  etUrl.setText("");
                  homeOverlay.setVisibility(View.VISIBLE);
                  Toast.makeText(this, "🔥 Purga completa: Cookies y cache destruidas", Toast.LENGTH_SHORT).show();
              }

              private void hideKeyboard() {
                  View view = this.getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
              }

              @Override
              protected void onDestroy() {
                  if (prefs.getBoolean("auto_purge", true)) {
                      purgaTotal();
                  }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  WebView wv = getCurrentWebView();
                  if (wv != null && wv.canGoBack()) {
                      wv.goBack();
                  } else if (homeOverlay.getVisibility() != View.VISIBLE) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                  } else if (tabList.size() > 1) {
                      cerrarPestana(currentTabIndex);
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralBrowser-Instalador
          path: app/build/outputs/apk/debug/*.apk
