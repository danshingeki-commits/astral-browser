                      if (width <= 0) return true;

                      float x = event.getX();
                      float bubbleWidth = liquidBubble.getWidth();
                      if (bubbleWidth <= 0) bubbleWidth = 140;

                      float targetBubbleX = Math.max(0, Math.min(x - (bubbleWidth / 2f), width - bubbleWidth));

                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                          case MotionEvent.ACTION_MOVE:
                              liquidBubble.setVisibility(View.VISIBLE);
                              liquidBubble.setX(targetBubbleX);

                              int zone = (int) ((x / (float) width) * 4);
                              if (zone < 0) zone = 0;
                              if (zone > 3) zone = 3;
                              selectedGestureZone = zone;

                              resaltarEtiquetas(selectedGestureZone);
                              break;

                          case MotionEvent.ACTION_UP:
                              liquidBubble.setVisibility(View.INVISIBLE);
                              resetearColorEtiquetas();
                              ejecutarAccionZona(selectedGestureZone);
                              selectedGestureZone = -1;
                              break;

                          case MotionEvent.ACTION_CANCEL:
                              liquidBubble.setVisibility(View.INVISIBLE);
                              resetearColorEtiquetas();
                              selectedGestureZone = -1;
                              break;
                      }
                      return true;
                  });
              }

              private void resaltarEtiquetas(int zone) {
                  lblBack.setTextColor(zone == 0 ? Color.parseColor("#38BDF8") : Color.parseColor("#64748B"));
                  lblForward.setTextColor(zone == 1 ? Color.parseColor("#38BDF8") : Color.parseColor("#64748B"));
                  lblRefresh.setTextColor(zone == 2 ? Color.parseColor("#38BDF8") : Color.parseColor("#64748B"));
                  lblSettings.setTextColor(zone == 3 ? Color.parseColor("#C084FC") : Color.parseColor("#64748B"));
              }

              private void resetearColorEtiquetas() {
                  lblBack.setTextColor(Color.parseColor("#F8FAFC"));
                  lblForward.setTextColor(Color.parseColor("#F8FAFC"));
                  lblRefresh.setTextColor(Color.parseColor("#38BDF8"));
                  lblSettings.setTextColor(Color.parseColor("#C084FC"));
              }

              private void ejecutarAccionZona(int zone) {
                  WebView wv = getCurrentWebView();
                  if (zone == 0) {
                      if (wv != null && wv.canGoBack()) wv.goBack();
                  } else if (zone == 1) {
                      if (wv != null && wv.canGoForward()) wv.goForward();
                  } else if (zone == 2) {
                      if (wv != null) wv.reload();
                  } else if (zone == 3) {
                      Intent intent = new Intent(MainActivity.this, SettingsActivity.class);
                      startActivity(intent);
                  }
              }

              private void cargarMikuOficial() {
                  new Thread(() -> {
                      try {
                          URL url = new URL(MIKU_URL);
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0");
                          conn.setDoInput(true);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          final Bitmap bm = BitmapFactory.decodeStream(is);
                          if (bm != null) {
                              runOnUiThread(() -> ivMiku.setImageBitmap(bm));
                          }
                      } catch (Exception ignored) {}
                  }).start();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  aplicarTemaYAnimacion();
                  actualizarAjustesDeRed();
                  for (WebView wv : tabList) {
                      configurarEscudosWebView(wv);
                  }
              }

              private void aplicarTemaYAnimacion() {
                  int theme = prefs.getInt("theme_mode", 0);
                  boolean enableAnim = prefs.getBoolean("enable_animations", true);

                  if (enableAnim) {
                      Animation floatAnim = AnimationUtils.loadAnimation(this, R.anim.floating_anim);
                      ivMiku.startAnimation(floatAnim);
                      bubbleRainView.setAnimationRunning(true);
                  } else {
                      ivMiku.clearAnimation();
                      bubbleRainView.setAnimationRunning(false);
                  }

                  if (theme == 1) { // AMOLED NEGRO PURO
                      mainRootLayout.setBackgroundColor(Color.parseColor("#000000"));
                      tabsTopBar.setBackgroundColor(Color.parseColor("#000000"));
                      chipsBar.setBackgroundColor(Color.parseColor("#050505"));
                      urlBarContainer.setBackgroundColor(Color.parseColor("#000000"));
                      etUrl.setBackgroundColor(Color.parseColor("#121212"));
                      bottomBarContainer.setBackgroundColor(Color.parseColor("#000000"));
                      homeOverlay.setBackgroundColor(Color.parseColor("#000000"));
                      webContainer.setBackgroundColor(Color.parseColor("#000000"));
                  } else if (theme == 2) { // TEMA CLARO
                      mainRootLayout.setBackgroundColor(Color.parseColor("#F1F5F9"));
                      tabsTopBar.setBackgroundColor(Color.parseColor("#E2E8F0"));
                      chipsBar.setBackgroundColor(Color.parseColor("#CBD5E1"));
                      urlBarContainer.setBackgroundColor(Color.parseColor("#F1F5F9"));
                      etUrl.setBackgroundColor(Color.parseColor("#F8FAFC"));
                      etUrl.setTextColor(Color.parseColor("#0F172A"));
                      bottomBarContainer.setBackgroundColor(Color.parseColor("#E2E8F0"));
                      homeOverlay.setBackgroundColor(Color.parseColor("#F8FAFC"));
                      webContainer.setBackgroundColor(Color.parseColor("#F8FAFC"));
                      tvLogoTitle.setTextColor(Color.parseColor("#0D9488"));
                  } else { // LIQUID GLASS CYBERPUNK
                      mainRootLayout.setBackgroundColor(Color.parseColor("#090610"));
                      tabsTopBar.setBackgroundColor(Color.parseColor("#B30E0919"));
                      chipsBar.setBackgroundColor(Color.parseColor("#800B0714"));
                      urlBarContainer.setBackgroundColor(Color.parseColor("#090610"));
                      etUrl.setBackgroundResource(R.drawable.bg_liquid_glass_input);
                      etUrl.setTextColor(Color.parseColor("#F8FAFC"));
                      bottomBarContainer.setBackgroundColor(Color.parseColor("#660E0919"));
                      homeOverlay.setBackgroundColor(Color.parseColor("#090610"));
                      webContainer.setBackgroundColor(Color.parseColor("#090610"));
                      tvLogoTitle.setTextColor(Color.parseColor("#39C5BB"));
                  }
                  actualizarBarraPestanasSuperior();
              }

              private void actualizarAjustesDeRed() {
                  int engineIdx = prefs.getInt("search_engine", 1);
                  if (engineIdx == 0) searchEngineUrl = "https://duckduckgo.com/?q=";
                  else if (engineIdx == 2) searchEngineUrl = "https://www.startpage.com/sp/search?query=";
                  else searchEngineUrl = "https://search.brave.com/search?q=";

                  boolean proxyEnabled = prefs.getBoolean("proxy_enabled", false);
                  String host = prefs.getString("proxy_host", "");
                  String port = prefs.getString("proxy_port", "");

                  if (proxyEnabled && !host.isEmpty() && !port.isEmpty()) {
                      System.setProperty("http.proxyHost", host);
                      System.setProperty("http.proxyPort", port);
                      System.setProperty("https.proxyHost", host);
                      System.setProperty("https.proxyPort", port);
                      chipProxy.setText("PROXY: " + host + ":" + port);
                      chipProxy.setTextColor(Color.parseColor("#34D399"));
                  } else {
                      System.clearProperty("http.proxyHost");
                      System.clearProperty("http.proxyPort");
                      System.clearProperty("https.proxyHost");
                      System.clearProperty("https.proxyPort");
                      chipProxy.setText("PROXY: DIRECTO");
                      chipProxy.setTextColor(Color.parseColor("#94A3B8"));
                  }

                  boolean trackers = prefs.getBoolean("block_trackers", true);
                  chipShields.setText(trackers ? "ESCUDOS: ON" : "ESCUDOS: OFF");
                  chipShields.setTextColor(trackers ? Color.parseColor("#34D399") : Color.parseColor("#EF4444"));
              }

              private void configurarEscudosWebView(WebView wv) {
                  if (wv == null) return;
                  WebSettings s = wv.getSettings();

                  boolean blockImages = prefs.getBoolean("block_images", false);
                  s.setLoadsImagesAutomatically(!blockImages);
                  s.setBlockNetworkImage(blockImages);

                  boolean desktop = prefs.getBoolean("desktop_mode", false);
                  s.setUserAgentString(desktop ? DESKTOP_UA : null);

                  boolean blockPopups = prefs.getBoolean("block_popups", true);
                  s.setJavaScriptCanOpenWindowsAutomatically(!blockPopups);
                  s.setSupportMultipleWindows(false);

                  boolean bgAudio = prefs.getBoolean("background_audio", true);
                  s.setMediaPlaybackRequiresUserGesture(!bgAudio);

                  boolean blockTrackers = prefs.getBoolean("block_trackers", true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(wv, !blockTrackers);
              }

              @SuppressLint("SetJavaScriptEnabled")
              private WebView crearNuevaPestana(String url, String title) {
                  WebView wv = new WebView(this);
                  wv.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings settings = wv.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  configurarEscudosWebView(wv);

                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (view == getCurrentWebView()) {
                              if (newProgress < 100) {
                                  progressBar.setVisibility(View.VISIBLE);
                                  progressBar.setProgress(newProgress);
                              } else {
                                  progressBar.setVisibility(View.GONE);
                              }
                          }
                      }
                  });

                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String startUrl, android.graphics.Bitmap favicon) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(startUrl);
                              homeOverlay.setVisibility(View.GONE);
                              actualizarChipProtocolo(startUrl);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String endUrl) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(endUrl);
                              actualizarTituloPestana(view.getTitle());
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String dest = request.getUrl().toString();
                          boolean forceHttps = prefs.getBoolean("force_https", true);
                          if (forceHttps && dest.startsWith("http://")) {
                              view.loadUrl(dest.replaceFirst("http://", "https://"));
                              return true;
                          }
                          return false;
                      }
                  });

                  if (url != null && !url.isEmpty()) {
                      wv.loadUrl(url);
                  }

                  tabList.add(wv);
                  tabTitles.add(title != null ? title : "Pestaña " + tabList.size());
                  cambiarAPestana(tabList.size() - 1);
                  return wv;
              }

              private void cambiarAPestana(int index) {
                  if (index < 0 || index >= tabList.size()) return;
                  currentTabIndex = index;
                  webContainer.removeAllViews();
                  WebView current = tabList.get(currentTabIndex);
                  webContainer.addView(current);

                  String currentUrl = current.getUrl();
                  if (currentUrl == null || currentUrl.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                      chipProtocol.setText("LOCAL");
                  } else {
                      homeOverlay.setVisibility(View.GONE);
                      etUrl.setText(currentUrl);
                      actualizarChipProtocolo(currentUrl);
                  }
                  btnTabCounter.setText(String.valueOf(tabList.size()));
                  actualizarBarraPestanasSuperior();
              }

              private void actualizarChipProtocolo(String url) {
                  if (url != null && url.startsWith("https://")) {
                      chipProtocol.setText("HTTPS");
                      chipProtocol.setTextColor(Color.parseColor("#34D399"));
                  } else {
                      chipProtocol.setText("HTTP");
                      chipProtocol.setTextColor(Color.parseColor("#EF4444"));
                  }
              }

              private void actualizarTituloPestana(String title) {
                  if (title != null && !title.isEmpty() && currentTabIndex < tabTitles.size()) {
                      if (title.length() > 14) title = title.substring(0, 12) + "..";
                      tabTitles.set(currentTabIndex, title);
                      actualizarBarraPestanasSuperior();
                  }
              }

              private void actualizarBarraPestanasSuperior() {
                  tabsContainer.removeAllViews();
                  int theme = prefs.getInt("theme_mode", 0);
                  String activeColor = theme == 1 ? "#1A1A1A" : (theme == 2 ? "#FFFFFF" : "#4D281745");
                  String inactiveColor = theme == 1 ? "#0A0A0A" : (theme == 2 ? "#CBD5E1" : "#330E0919");
                  String textColor = theme == 2 ? "#0F172A" : "#F8FAFC";

                  for (int i = 0; i < tabList.size(); i++) {
                      final int tabIndex = i;
                      LinearLayout tabButton = new LinearLayout(this);
                      tabButton.setOrientation(LinearLayout.HORIZONTAL);
                      tabButton.setPadding(14, 6, 10, 6);
                      tabButton.setGravity(Gravity.CENTER_VERTICAL);
                      tabButton.setBackgroundColor(Color.parseColor(i == currentTabIndex ? activeColor : inactiveColor));

                      TextView tv = new TextView(this);
                      tv.setText(tabTitles.get(i));
                      tv.setTextSize(11);
                      tv.setTextColor(Color.parseColor(i == currentTabIndex ? textColor : "#94A3B8"));
                      tabButton.addView(tv);

                      TextView closeBtn = new TextView(this);
                      closeBtn.setText(" ✕");
                      closeBtn.setTextSize(11);
                      closeBtn.setTextColor(Color.parseColor("#EF4444"));
                      closeBtn.setPadding(8, 0, 0, 0);
                      closeBtn.setOnClickListener(v -> cerrarPestana(tabIndex));
                      tabButton.addView(closeBtn);

                      tabButton.setOnClickListener(v -> cambiarAPestana(tabIndex));
                      tabsContainer.addView(tabButton);
                  }
              }

              // NUEVO GESTOR DE PESTAÑAS ESTILO BRAVE/CHROME
              private void mostrarListaPestanas() {
                  tabManagerOverlay.setVisibility(View.VISIBLE);
                  tabListContainer.removeAllViews();

                  int theme = prefs.getInt("theme_mode", 0);
                  String textColor = theme == 2 ? "#0F172A" : "#F8FAFC";

                  for (int i = 0; i < tabList.size(); i++) {
                      final int tabIndex = i;

                      LinearLayout card = new LinearLayout(this);
                      card.setOrientation(LinearLayout.HORIZONTAL);
                      LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                      params.setMargins(0, 0, 0, 24);
                      card.setLayoutParams(params);
                      card.setPadding(40, 32, 20, 32);
                      card.setBackgroundResource(R.drawable.bg_liquid_glass_card);
                      card.setGravity(Gravity.CENTER_VERTICAL);

                      LinearLayout textContainer = new LinearLayout(this);
                      textContainer.setOrientation(LinearLayout.VERTICAL);
                      textContainer.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));

                      TextView tvTitle = new TextView(this);
                      tvTitle.setText(tabTitles.get(i));
                      tvTitle.setTextColor(Color.parseColor(textColor));
                      tvTitle.setTextSize(16);
                      tvTitle.setMaxLines(1);
                      tvTitle.setTypeface(null, Typeface.BOLD);

                      TextView tvUrl = new TextView(this);
                      String url = tabList.get(i).getUrl();
                      tvUrl.setText(url != null && !url.isEmpty() ? url : "Nueva pestaña (Vacía)");
                      tvUrl.setTextColor(Color.parseColor("#94A3B8"));
                      tvUrl.setTextSize(12);
                      tvUrl.setMaxLines(1);

                      textContainer.addView(tvTitle);
                      textContainer.addView(tvUrl);

                      Button btnClose = new Button(this);
                      btnClose.setText("✕");
                      btnClose.setTextColor(Color.parseColor("#EF4444"));
                      btnClose.setBackgroundColor(Color.TRANSPARENT);
                      btnClose.setTextSize(18);
                      btnClose.setLayoutParams(new LinearLayout.LayoutParams(120, 120));
                      btnClose.setOnClickListener(v -> {
                          cerrarPestana(tabIndex);
                          if (tabList.isEmpty()) {
                              tabManagerOverlay.setVisibility(View.GONE);
                          } else {
                              mostrarListaPestanas(); // Refrescar lista
                          }
                      });

                      card.addView(textContainer);
                      card.addView(btnClose);

                      card.setOnClickListener(v -> {
                          cambiarAPestana(tabIndex);
                          tabManagerOverlay.setVisibility(View.GONE);
                      });

                      tabListContainer.addView(card);
                  }
              }

              private void cerrarPestana(int index) {
                  if (tabList.size() <= 1) {
                      WebView wv = tabList.get(0);
                      wv.clearHistory();
                      wv.loadUrl("about:blank");
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                      tabTitles.set(0, "Inicio Miku");
                      btnTabCounter.setText("1");
                      actualizarBarraPestanasSuperior();
                      return;
                  }

                  WebView removed = tabList.remove(index);
                  tabTitles.remove(index);
                  removed.destroy();

                  if (currentTabIndex >= tabList.size()) {
                      currentTabIndex = tabList.size() - 1;
                  }
                  cambiarAPestana(currentTabIndex);
              }

              private WebView getCurrentWebView() {
                  if (currentTabIndex >= 0 && currentTabIndex < tabList.size()) {
                      return tabList.get(currentTabIndex);
                  }
                  return null;
              }

              private void navegar() {
                  String input = etUrl.getText().toString().trim();
                  hideKeyboard();
                  WebView wv = getCurrentWebView();
                  if (wv == null) return;

                  if (input.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      return;
                  }

                  homeOverlay.setVisibility(View.GONE);

                  if (input.startsWith("http://") || input.startsWith("https://")) {
                      wv.loadUrl(input);
                  } else if (input.contains(".") && !input.contains(" ")) {
                      wv.loadUrl("https://" + input);
                  } else {
                      try {
                          String query = URLEncoder.encode(input, "UTF-8");
                          wv.loadUrl(searchEngineUrl + query);
                      } catch (UnsupportedEncodingException e) {
                          wv.loadUrl(searchEngineUrl + input);
                      }
                  }
              }

              private void hideKeyboard() {
                  View view = this.getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (onboardingOverlay.getVisibility() == View.VISIBLE) {
                      prefs.edit().putBoolean("onboarding_done", true).apply();
                      onboardingOverlay.setVisibility(View.GONE);
                      return;
                  }
                  if (tabManagerOverlay.getVisibility() == View.VISIBLE) {
                      tabManagerOverlay.setVisibility(View.GONE);
                      return;
                  }

                  WebView wv = getCurrentWebView();
                  if (wv != null && wv.canGoBack()) {
                      wv.goBack();
                  } else if (homeOverlay.getVisibility() != View.VISIBLE) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                  } else if (tabList.size() > 1) {
                      cerrarPestana(currentTabIndex);
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AstralBrowser.apk

      - name: Publicar Release con APK directo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.9-build${{ github.run_number }}"
          name: "Astral Browser v2.9 (Tab Manager)"
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/AstralBrowser.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
