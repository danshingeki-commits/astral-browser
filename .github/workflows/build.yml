name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/drawable

          curl -L -s -A "Mozilla/5.0" -o app/src/main/res/drawable/miku_avatar.png "https://upload.wikimedia.org/wikipedia/en/thumb/1/1e/Hatsune_Miku_V4x.png/440px-Hatsune_Miku_V4x.png" || true

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 20
                  versionName "2.9"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:label="Configuracion" />
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Astral Browser</string>
              <string name="url_hint">Buscar o escribir URL...</string>
          </resources>
          EOF

          # 7. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#090610</item>
                  <item name="android:statusBarColor">#0D0819</item>
                  <item name="android:navigationBarColor">#090610</item>
                  <item name="colorPrimary">#38BDF8</item>
              </style>
          </resources>
          EOF

          # 8. ELEMENTOS LIQUID GLASS
          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_bar.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#CC181028" android:endColor="#990E081A" android:angle="90" />
              <corners android:radius="28dp" />
              <stroke android:width="1.2dp" android:color="#40C084FC" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#F218102C" android:endColor="#D90E081A" android:angle="135" />
              <corners android:radius="24dp" />
              <stroke android:width="1.5dp" android:color="#66C084FC" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#E638BDF8" android:endColor="#80A855F7" android:angle="45" />
              <corners android:radius="22dp" />
              <stroke android:width="1.5dp" android:color="#FFFFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_input.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#331A122E" />
              <corners android:radius="24dp" />
              <stroke android:width="1dp" android:color="#4D94A3B8" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#66130B24" />
              <corners android:radius="12dp" />
              <stroke android:width="0.8dp" android:color="#3338BDF8" />
          </shape>
          EOF

          # 9. Animacion Miku
          cat << 'EOF' > app/src/main/res/anim/floating_anim.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <translate android:fromYDelta="0%p" android:toYDelta="-3.5%p" android:duration="1800" android:repeatCount="infinite" android:repeatMode="reverse" />
          </set>
          EOF

          # 10. Respaldo Miku
          cat << 'EOF' > app/src/main/res/drawable/ic_miku_fallback.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="160dp" android:height="160dp" android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#150E24" android:pathData="M50,10 A40,40 0 1,0 50,90 A40,40 0 1,0 50,10 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M22,25 C16,42 16,72 23,82 C26,68 30,50 36,36 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M78,25 C84,42 84,72 77,82 C74,68 70,50 64,36 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M34,22 C44,14 56,14 66,22 C62,34 38,34 34,22 Z" />
              <path android:fillColor="#FFDFC4" android:pathData="M36,30 C36,48 64,48 64,30 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M43,36 A2.5,2.5 0 1,1 43,35.9 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M57,36 A2.5,2.5 0 1,1 57,35.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M30,30 A4,4 0 1,1 30,29.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M70,30 A4,4 0 1,1 70,29.9 Z" />
          </vector>
          EOF

          # 11. BubbleRainView.java
          cat << 'EOF' > app/src/main/java/com/astral/browser/BubbleRainView.java
          package com.astral.browser;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.util.AttributeSet;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public class BubbleRainView extends View {
              private static class Bubble { float x, y, speed, radius, alpha; int color; }
              private final List<Bubble> bubbles = new ArrayList<>();
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint glowPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Random random = new Random();
              private boolean isAnimating = true;

              public BubbleRainView(Context context) { super(context); init(); }
              public BubbleRainView(Context context, AttributeSet attrs) { super(context, attrs); init(); }

              private void init() {
                  paint.setStyle(Paint.Style.FILL);
                  glowPaint.setStyle(Paint.Style.STROKE);
                  glowPaint.setStrokeWidth(1.5f);
                  glowPaint.setColor(Color.parseColor("#80FFFFFF"));
              }
              public void setAnimationRunning(boolean running) {
                  this.isAnimating = running;
                  if (running) invalidate();
              }
              @Override protected void onSizeChanged(int w, int h, int oldw, int oldh) {
                  super.onSizeChanged(w, h, oldw, oldh);
                  bubbles.clear();
                  for (int i = 0; i < 28; i++) bubbles.add(crearBurbuja(w, h, true));
              }
              private Bubble crearBurbuja(int width, int height, boolean randomY) {
                  Bubble b = new Bubble();
                  b.radius = 4f + random.nextFloat() * 14f;
                  b.x = random.nextFloat() * (width > 0 ? width : 1080);
                  b.y = randomY ? (random.nextFloat() * (height > 0 ? height : 1920)) : -b.radius * 2;
                  b.speed = 1.2f + random.nextFloat() * 3.2f;
                  b.alpha = 0.25f + random.nextFloat() * 0.45f;
                  b.color = random.nextBoolean() ? Color.parseColor("#38BDF8") : Color.parseColor("#39C5BB");
                  return b;
              }
              @Override protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  int w = getWidth(), h = getHeight();
                  if (w <= 0 || h <= 0) return;
                  for (Bubble b : bubbles) {
                      paint.setColor(b.color); paint.setAlpha((int) (b.alpha * 255));
                      canvas.drawCircle(b.x, b.y, b.radius, paint);
                      canvas.drawCircle(b.x, b.y, b.radius, glowPaint);
                      if (isAnimating) {
                          b.y += b.speed; b.x += (float) Math.sin(b.y * 0.02) * 0.4f;
                          if (b.y - b.radius > h) { b.y = -b.radius * 2; b.x = random.nextFloat() * w; }
                      }
                  }
                  if (isAnimating) postInvalidateOnAnimation();
              }
          }
          EOF

          # 12. activity_main.xml (Contiene el nuevo TabManagerOverlay)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090610">

              <LinearLayout
                  android:id="@+id/mainRootLayout"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical">

                  <LinearLayout
                      android:id="@+id/tabsTopBar"
                      android:layout_width="match_parent"
                      android:layout_height="40dp"
                      android:orientation="horizontal"
                      android:background="#B30E0919"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:gravity="center_vertical">

                      <HorizontalScrollView
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="1"
                          android:scrollbars="none">

                          <LinearLayout
                              android:id="@+id/tabsContainer"
                              android:layout_width="wrap_content"
                              android:layout_height="match_parent"
                              android:orientation="horizontal"
                              android:gravity="center_vertical" />
                      </HorizontalScrollView>

                      <Button
                          android:id="@+id/btnTabCounter"
                          android:layout_width="36dp"
                          android:layout_height="32dp"
                          android:text="1"
                          android:textSize="12sp"
                          android:textColor="#38BDF8"
                          android:textStyle="bold"
                          android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnNewTab"
                      android:layout_width="34dp"
                      android:layout_height="34dp"
                      android:text="+"
                      android:textSize="18sp"
                      android:textColor="#38BDF8"
                      android:background="?android:attr/selectableItemBackground" />
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/chipsBar"
                      android:layout_width="match_parent"
                      android:layout_height="28dp"
                      android:orientation="horizontal"
                      android:background="#800B0714"
                      android:paddingLeft="10dp"
                      android:paddingRight="10dp"
                      android:gravity="center_vertical">

                      <TextView
                          android:id="@+id/chipProxy"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="PROXY: DIRECTO"
                          android:textColor="#94A3B8"
                          android:textSize="9sp"
                          android:paddingLeft="8dp"
                          android:paddingRight="8dp"
                          android:paddingTop="3dp"
                          android:paddingBottom="3dp"
                          android:background="@drawable/bg_liquid_glass_chip"
                          android:layout_marginRight="6dp" />

                      <TextView
                          android:id="@+id/chipShields"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="ESCUDOS: ON"
                          android:textColor="#34D399"
                          android:textSize="9sp"
                          android:paddingLeft="8dp"
                          android:paddingRight="8dp"
                          android:paddingTop="3dp"
                          android:paddingBottom="3dp"
                          android:background="@drawable/bg_liquid_glass_chip"
                          android:layout_marginRight="6dp" />

                      <TextView
                          android:id="@+id/chipProtocol"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="HTTPS"
                          android:textColor="#38BDF8"
                          android:textSize="9sp"
                          android:paddingLeft="8dp"
                          android:paddingRight="8dp"
                          android:paddingTop="3dp"
                          android:paddingBottom="3dp"
                          android:background="@drawable/bg_liquid_glass_chip" />
                  </LinearLayout>

                  <FrameLayout
                      android:id="@+id/urlBarContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#090610"
                      android:paddingLeft="12dp"
                      android:paddingRight="12dp"
                      android:paddingTop="8dp"
                      android:paddingBottom="6dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="44dp"
                          android:orientation="horizontal"
                          android:background="@drawable/bg_liquid_glass_input"
                          android:gravity="center_vertical">

                          <EditText
                              android:id="@+id/etUrl"
                              android:layout_width="0dp"
                              android:layout_height="match_parent"
                              android:layout_weight="1"
                              android:background="@null"
                              android:textColor="#F8FAFC"
                              android:textColorHint="#94A3B8"
                              android:hint="@string/url_hint"
                              android:textSize="13sp"
                              android:paddingLeft="16dp"
                              android:paddingRight="10dp"
                              android:singleLine="true"
                              android:imeOptions="actionGo"
                              android:inputType="textUri" />

                          <Button
                              android:id="@+id/btnGo"
                              android:layout_width="48dp"
                              android:layout_height="match_parent"
                              android:text="Ir"
                              android:textColor="#38BDF8"
                              android:textSize="12sp"
                              android:background="?android:attr/selectableItemBackgroundBorderless" />
                      </LinearLayout>
                  </FrameLayout>

                  <ProgressBar
                      android:id="@+id/progressBar"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent"
                      android:layout_height="2dp"
                      android:visibility="gone" />

                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1">

                      <FrameLayout
                          android:id="@+id/webContainer"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:background="#090610" />

                      <FrameLayout
                          android:id="@+id/homeOverlay"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:background="#090610"
                          android:visibility="visible">

                          <com.astral.browser.BubbleRainView
                              android:id="@+id/bubbleRainView"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="vertical"
                              android:gravity="center"
                              android:padding="20dp">

                              <ImageView
                                  android:id="@+id/ivMiku"
                                  android:layout_width="190dp"
                                  android:layout_height="230dp"
                                  android:scaleType="fitCenter"
                                  android:src="@drawable/ic_miku_fallback"
                                  android:contentDescription="Hatsune Miku" />

                              <TextView
                                  android:id="@+id/tvLogoTitle"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="A S T R A L"
                                  android:textColor="#39C5BB"
                                  android:textSize="18sp"
                                  android:textStyle="bold"
                                  android:letterSpacing="0.25"
                                  android:layout_marginTop="14dp" />

                              <TextView
                                  android:id="@+id/tvEngineInfo"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="Liquid Glass Edition • Sin Rastreo"
                                  android:textColor="#64748B"
                                  android:textSize="12sp"
                                  android:layout_marginTop="4dp" />
                          </LinearLayout>
                      </FrameLayout>
                  </FrameLayout>

                  <LinearLayout
                      android:id="@+id/bottomBarContainer"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="#660E0919"
                      android:padding="8dp">

                      <FrameLayout
                          android:id="@+id/interactiveBarFrame"
                          android:layout_width="match_parent"
                          android:layout_height="54dp"
                          android:background="@drawable/bg_liquid_glass_bar">

                          <View
                              android:id="@+id/liquidBubble"
                              android:layout_width="80dp"
                              android:layout_height="44dp"
                              android:layout_gravity="center_vertical"
                              android:background="@drawable/bg_liquid_bubble"
                              android:visibility="invisible" />

                          <LinearLayout
                              android:id="@+id/barLabelsLayout"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:orientation="horizontal"
                              android:weightSum="4"
                              android:gravity="center_vertical">

                              <TextView
                                  android:id="@+id/lblBack"
                                  android:layout_width="0dp"
                                  android:layout_height="match_parent"
                                  android:layout_weight="1"
                                  android:text="‹ Atrás"
                                  android:gravity="center"
                                  android:textColor="#F8FAFC"
                                  android:textSize="12sp"
                                  android:textStyle="bold"
                                  android:singleLine="true" />

                              <TextView
                                  android:id="@+id/lblForward"
                                  android:layout_width="0dp"
                                  android:layout_height="match_parent"
                                  android:layout_weight="1"
                                  android:text="Adelante ›"
                                  android:gravity="center"
                                  android:textColor="#F8FAFC"
                                  android:textSize="12sp"
                                  android:textStyle="bold"
                                  android:singleLine="true" />

                              <TextView
                                  android:id="@+id/lblRefresh"
                                  android:layout_width="0dp"
                                  android:layout_height="match_parent"
                                  android:layout_weight="1"
                                  android:text="Recargar"
                                  android:gravity="center"
                                  android:textColor="#38BDF8"
                                  android:textSize="12sp"
                                  android:textStyle="bold"
                                  android:singleLine="true" />

                              <TextView
                                  android:id="@+id/lblSettings"
                                  android:layout_width="0dp"
                                  android:layout_height="match_parent"
                                  android:layout_weight="1"
                                  android:text="Ajustes ⚙"
                                  android:gravity="center"
                                  android:textColor="#C084FC"
                                  android:textSize="12sp"
                                  android:textStyle="bold"
                                  android:singleLine="true" />
                          </LinearLayout>
                      </FrameLayout>
                  </LinearLayout>
              </LinearLayout>

              <!-- GESTOR DE PESTAÑAS (TIPO CHROME/BRAVE) -->
              <FrameLayout
                  android:id="@+id/tabManagerOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#F2090610"
                  android:clickable="true"
                  android:focusable="true"
                  android:visibility="gone"
                  android:elevation="10dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:layout_marginBottom="16dp">
                          <TextView
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Pestañas Abiertas"
                              android:textColor="#F8FAFC"
                              android:textSize="20sp"
                              android:textStyle="bold" />
                          <Button
                              android:id="@+id/btnCloseTabManager"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:text="✕"
                              android:textColor="#94A3B8"
                              android:textSize="20sp"
                              android:background="?android:attr/selectableItemBackgroundBorderless" />
                      </LinearLayout>

                      <ScrollView
                          android:layout_width="match_parent"
                          android:layout_height="0dp"
                          android:layout_weight="1"
                          android:scrollbars="none">
                          <LinearLayout
                              android:id="@+id/tabListContainer"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:orientation="vertical" />
                      </ScrollView>

                      <Button
                          android:id="@+id/btnNewTabFromManager"
                          android:layout_width="match_parent"
                          android:layout_height="54dp"
                          android:text="+ Nueva Pestaña"
                          android:textColor="#090610"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:background="#38BDF8"
                          android:layout_marginTop="16dp" />
                  </LinearLayout>
              </FrameLayout>

              <!-- BIENVENIDA / ONBOARDING -->
              <FrameLayout
                  android:id="@+id/onboardingOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#D9090610"
                  android:padding="24dp"
                  android:elevation="20dp"
                  android:visibility="gone">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:orientation="vertical"
                      android:background="@drawable/bg_liquid_glass_card"
                      android:padding="24dp"
                      android:gravity="center_horizontal">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="BETA ABIERTA"
                          android:textColor="#38BDF8"
                          android:textSize="10sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.2"
                          android:paddingLeft="10dp"
                          android:paddingRight="10dp"
                          android:paddingTop="4dp"
                          android:paddingBottom="4dp"
                          android:background="@drawable/bg_liquid_glass_chip"
                          android:layout_marginBottom="12dp" />

                      <TextView
