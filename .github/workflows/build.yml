name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Astral Private</string>
              <string name="btn_back">&lt;</string>
              <string name="btn_forward">&gt;</string>
              <string name="btn_refresh">R</string>
              <string name="btn_settings">S</string>
              <string name="btn_incognito_off">Norm</string>
              <string name="btn_incognito_on">Incog</string>
              <string name="btn_burn">Purga</string>
              <string name="url_hint">Buscar en privado o URL...</string>
          </resources>
          EOF

          # 7. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0B0813</item>
                  <item name="android:statusBarColor">#110B1F</item>
              </style>
          </resources>
          EOF

          # 8. Animacion suave de flotacion para Miku (subida y bajada ligera)
          cat << 'EOF' > app/src/main/res/anim/floating_anim.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <translate
                  android:fromYDelta="0%p"
                  android:toYDelta="-3.5%p"
                  android:duration="1800"
                  android:repeatCount="infinite"
                  android:repeatMode="reverse" />
          </set>
          EOF

          # 9. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0813"
              android:fitsSystemWindows="true">

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:background="#110B1F"
                  android:padding="5dp"
                  android:gravity="center_vertical">

                  <Button
                      android:id="@+id/btnBack"
                      android:layout_width="32dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_back"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnForward"
                      android:layout_width="32dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_forward"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnRefresh"
                      android:layout_width="32dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_refresh"
                      android:textColor="#94A3B8"
                      android:background="?android:attr/selectableItemBackground" />

                  <EditText
                      android:id="@+id/etUrl"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="#1A132C"
                      android:textColor="#F8FAFC"
                      android:textColorHint="#64748B"
                      android:hint="@string/url_hint"
                      android:textSize="12sp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:singleLine="true"
                      android:imeOptions="actionGo"
                      android:inputType="textUri" />

                  <Button
                      android:id="@+id/btnIncognito"
                      android:layout_width="48dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_incognito_off"
                      android:textColor="#94A3B8"
                      android:textSize="10sp"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnSettings"
                      android:layout_width="32dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_settings"
                      android:textColor="#38BDF8"
                      android:textSize="11sp"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnTabs"
                      android:layout_width="34dp"
                      android:layout_height="38dp"
                      android:text="1"
                      android:textColor="#38BDF8"
                      android:textStyle="bold"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnBurn"
                      android:layout_width="44dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_burn"
                      android:textColor="#EF4444"
                      android:textSize="10sp"
                      android:background="?android:attr/selectableItemBackground" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:visibility="gone" />

              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <FrameLayout
                      android:id="@+id/webContainer"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="#0B0813" />

                  <!-- Pantalla de inicio con Miku y animacion flotante -->
                  <LinearLayout
                      android:id="@+id/homeOverlay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:background="#0B0813"
                      android:padding="20dp"
                      android:visibility="visible">

                      <ImageView
                          android:id="@+id/ivMiku"
                          android:layout_width="160dp"
                          android:layout_height="160dp"
                          android:contentDescription="Miku Avatar" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="A S T R A L   P R I V A T E"
                          android:textColor="#C084FC"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.15"
                          android:layout_marginTop="16dp" />

                      <TextView
                          android:id="@+id/tvEngineInfo"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Sesion Limpia • Sin Registros"
                          android:textColor="#64748B"
                          android:textSize="12sp"
                          android:layout_marginTop="6dp" />
                  </LinearLayout>
              </FrameLayout>
          </LinearLayout>
          EOF

          # 10. MainActivity.java con carga de avatar de Miku, animacion y panel de ajustes
          cat << 'EOF' > app/src/main/java/com/astral/browser/MainActivity.java
          package com.astral.browser;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.Animation;
          import android.view.animation.AnimationUtils;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.InputStream;
          import java.io.UnsupportedEncodingException;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private FrameLayout webContainer;
              private LinearLayout topBar;
              private LinearLayout homeOverlay;
              private ImageView ivMiku;
              private EditText etUrl;
              private ProgressBar progressBar;
              private Button btnTabs;
              private Button btnIncognito;
              private Button btnSettings;
              private TextView tvEngineInfo;

              private final List<WebView> tabList = new ArrayList<>();
              private int currentTabIndex = 0;
              private boolean isIncognitoActive = false;

              private SharedPreferences prefs;
              private String searchEngineUrl = "https://duckduckgo.com/?q=";

              private static final String MIKU_IMAGE_URL = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  prefs = getSharedPreferences("astral_settings", MODE_PRIVATE);
                  cargarAjustesRed();

                  webContainer = findViewById(R.id.webContainer);
                  homeOverlay = findViewById(R.id.homeOverlay);
                  ivMiku = findViewById(R.id.ivMiku);
                  topBar = findViewById(R.id.topBar);
                  etUrl = findViewById(R.id.etUrl);
                  progressBar = findViewById(R.id.progressBar);
                  btnTabs = findViewById(R.id.btnTabs);
                  btnIncognito = findViewById(R.id.btnIncognito);
                  btnSettings = findViewById(R.id.btnSettings);
                  tvEngineInfo = findViewById(R.id.tvEngineInfo);

                  Button btnBack = findViewById(R.id.btnBack);
                  Button btnForward = findViewById(R.id.btnForward);
                  Button btnRefresh = findViewById(R.id.btnRefresh);
                  Button btnBurn = findViewById(R.id.btnBurn);

                  iniciarMikuAnimada();
                  crearNuevaPestana("");

                  btnBack.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoBack()) wv.goBack();
                  });

                  btnForward.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoForward()) wv.goForward();
                  });

                  btnRefresh.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null) wv.reload();
                  });

                  btnIncognito.setOnClickListener(v -> toggleIncognito());
                  btnSettings.setOnClickListener(v -> mostrarDialogoAjustes());
                  btnTabs.setOnClickListener(v -> mostrarDialogoPestanas());

                  etUrl.setOnEditorActionListener((TextView v, int actionId, KeyEvent event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_SEARCH ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          navegarDesdeInput();
                          return true;
                      }
                      return false;
                  });

                  btnBurn.setOnClickListener(v -> purgaTotal());
              }

              private void iniciarMikuAnimada() {
                  Animation floatAnim = AnimationUtils.loadAnimation(this, R.anim.floating_anim);
                  ivMiku.startAnimation(floatAnim);

                  // Carga segura del avatar en segundo plano
                  new Thread(() -> {
                      try {
                          URL url = new URL("https://i.pinimg.com/736x/87/42/47/8742475aa8ec7dc662176dcba3f742f3.jpg");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setDoInput(true);
                          conn.connect();
                          InputStream is = conn.getInputStream();
                          final Bitmap bm = BitmapFactory.decodeStream(is);
                          runOnUiThread(() -> {
                              if (bm != null) ivMiku.setImageBitmap(bm);
                          });
                      } catch (Exception ignored) {
                      }
                  }).start();
              }

              private void cargarAjustesRed() {
                  String proxyHost = prefs.getString("proxy_host", "");
                  String proxyPort = prefs.getString("proxy_port", "");
                  if (!proxyHost.isEmpty() && !proxyPort.isEmpty()) {
                      System.setProperty("http.proxyHost", proxyHost);
                      System.setProperty("http.proxyPort", proxyPort);
                      System.setProperty("https.proxyHost", proxyHost);
                      System.setProperty("https.proxyPort", proxyPort);
                  }
                  int engineIdx = prefs.getInt("search_engine", 0);
                  if (engineIdx == 1) searchEngineUrl = "https://search.brave.com/search?q=";
                  else if (engineIdx == 2) searchEngineUrl = "https://www.startpage.com/sp/search?query=";
                  else searchEngineUrl = "https://duckduckgo.com/?q=";
              }

              private void mostrarDialogoAjustes() {
                  String[] opciones = {"Motor de Búsqueda", "Configurar Proxy HTTP", "Restablecer Proxy", "Acerca de Astral"};
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Ajustes de Privacidad");
                  builder.setItems(opciones, (dialog, which) -> {
                      if (which == 0) elegirMotor();
                      else if (which == 1) configurarProxyInput();
                      else if (which == 2) restablecerProxy();
                      else Toast.makeText(this, "Astral Browser v1.3 • Privado y Seguro", Toast.LENGTH_SHORT).show();
                  });
                  builder.show();
              }

              private void elegirMotor() {
                  String[] motores = {"DuckDuckGo (Recomendado)", "Brave Search", "Startpage"};
                  int actual = prefs.getInt("search_engine", 0);
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Seleccionar Motor");
                  builder.setSingleChoiceItems(motores, actual, (dialog, which) -> {
                      prefs.edit().putInt("search_engine", which).apply();
                      cargarAjustesRed();
                      dialog.dismiss();
                      Toast.makeText(this, "Motor cambiado", Toast.LENGTH_SHORT).show();
                  });
                  builder.show();
              }

              private void configurarProxyInput() {
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(30, 20, 30, 20);

                  final EditText etHost = new EditText(this);
                  etHost.setHint("Host (ej. 127.0.0.1)");
                  etHost.setText(prefs.getString("proxy_host", ""));
                  layout.addView(etHost);

                  final EditText etPort = new EditText(this);
                  etPort.setHint("Puerto (ej. 8118)");
                  etPort.setText(prefs.getString("proxy_port", ""));
                  layout.addView(etPort);

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Configurar Proxy");
                  builder.setView(layout);
                  builder.setPositiveButton("Guardar", (dialog, which) -> {
                      String host = etHost.getText().toString().trim();
                      String port = etPort.getText().toString().trim();
                      prefs.edit().putString("proxy_host", host).putString("proxy_port", port).apply();
                      cargarAjustesRed();
                      Toast.makeText(this, "Proxy aplicado para nuevas peticiones", Toast.LENGTH_SHORT).show();
                  });
                  builder.setNegativeButton("Cancelar", null);
                  builder.show();
              }

              private void restablecerProxy() {
                  prefs.edit().remove("proxy_host").remove("proxy_port").apply();
                  System.clearProperty("http.proxyHost");
                  System.clearProperty("http.proxyPort");
                  System.clearProperty("https.proxyHost");
                  System.clearProperty("https.proxyPort");
                  Toast.makeText(this, "Proxy desactivado", Toast.LENGTH_SHORT).show();
              }

              private void toggleIncognito() {
                  isIncognitoActive = !isIncognitoActive;
                  WebView wv = getCurrentWebView();

                  if (isIncognitoActive) {
                      btnIncognito.setText(R.string.btn_incognito_on);
                      btnIncognito.setTextColor(Color.parseColor("#A855F7"));
                      topBar.setBackgroundColor(Color.parseColor("#1F0A2E"));
                      aplicarAjustesIncognito(wv, true);
                      Toast.makeText(this, "🕶️ Incógnito estricto: Cero almacenamiento local", Toast.LENGTH_SHORT).show();
                  } else {
                      btnIncognito.setText(R.string.btn_incognito_off);
                      btnIncognito.setTextColor(Color.parseColor("#94A3B8"));
                      topBar.setBackgroundColor(Color.parseColor("#110B1F"));
                      aplicarAjustesIncognito(wv, false);
                      Toast.makeText(this, "Modo privado estándar", Toast.LENGTH_SHORT).show();
                  }
                  if (wv != null && wv.getUrl() != null && !wv.getUrl().isEmpty()) {
                      wv.reload();
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void aplicarAjustesIncognito(WebView wv, boolean incognito) {
                  if (wv == null) return;
                  WebSettings settings = wv.getSettings();
                  CookieManager cookieManager = CookieManager.getInstance();

                  if (incognito) {
                      settings.setDomStorageEnabled(false);
                      settings.setDatabaseEnabled(false);
                      settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                      cookieManager.setAcceptCookie(false);
                      cookieManager.setAcceptThirdPartyCookies(wv, false);
                      wv.clearCache(true);
                  } else {
                      settings.setDomStorageEnabled(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(wv, false);
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private WebView crearNuevaPestana(String url) {
                  WebView wv = new WebView(this);
                  wv.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings settings = wv.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setSaveFormData(false);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  aplicarAjustesIncognito(wv, isIncognitoActive);

                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (view == getCurrentWebView()) {
                              if (newProgress < 100) {
                                  progressBar.setVisibility(View.VISIBLE);
                                  progressBar.setProgress(newProgress);
                              } else {
                                  progressBar.setVisibility(View.GONE);
                              }
                          }
                      }
                  });

                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String startUrl, Bitmap favicon) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(startUrl);
                              homeOverlay.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String endUrl) {
                          if (view == getCurrentWebView()) {
                              etUrl.setText(endUrl);
                          }
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });

                  if (url != null && !url.isEmpty()) {
                      wv.loadUrl(url);
                  }

                  tabList.add(wv);
                  cambiarAPestana(tabList.size() - 1);
                  return wv;
              }

              private void cambiarAPestana(int index) {
                  if (index < 0 || index >= tabList.size()) return;
                  currentTabIndex = index;
                  webContainer.removeAllViews();
                  WebView current = tabList.get(currentTabIndex);
                  webContainer.addView(current);

                  String currentUrl = current.getUrl();
                  if (currentUrl == null || currentUrl.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                  } else {
                      homeOverlay.setVisibility(View.GONE);
                      etUrl.setText(currentUrl);
                  }
                  btnTabs.setText(String.valueOf(tabList.size()));
              }

              private void cerrarPestana(int index) {
                  if (tabList.size() <= 1) {
                      purgaTotal();
                      return;
                  }
                  WebView wv = tabList.remove(index);
                  wv.clearCache(true);
                  wv.destroy();

                  if (currentTabIndex >= tabList.size()) {
                      currentTabIndex = tabList.size() - 1;
                  }
                  cambiarAPestana(currentTabIndex);
              }

              private void mostrarDialogoPestanas() {
                  List<String> items = new ArrayList<>();
                  for (int i = 0; i < tabList.size(); i++) {
                      String url = tabList.get(i).getUrl();
                      items.add("Pestaña " + (i + 1) + ": " + (url != null && !url.isEmpty() ? url : "Inicio Miku"));
                  }
                  items.add("➕ Abrir nueva pestaña");

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Pestañas Privadas");
                  builder.setItems(items.toArray(new String[0]), (dialog, which) -> {
                      if (which == tabList.size()) {
                          crearNuevaPestana("");
                      } else {
                          cambiarAPestana(which);
                      }
                  });
                  builder.setNeutralButton("Cerrar pestaña actual", (dialog, which) -> cerrarPestana(currentTabIndex));
                  builder.show();
              }

              private WebView getCurrentWebView() {
                  if (currentTabIndex >= 0 && currentTabIndex < tabList.size()) {
                      return tabList.get(currentTabIndex);
                  }
                  return null;
              }

              private void navegarDesdeInput() {
                  String input = etUrl.getText().toString().trim();
                  hideKeyboard();
                  WebView wv = getCurrentWebView();
                  if (wv == null) return;

                  if (input.isEmpty()) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      return;
                  }

                  homeOverlay.setVisibility(View.GONE);

                  if (input.startsWith("http://") || input.startsWith("https://")) {
                      wv.loadUrl(input);
                  } else if (input.contains(".") && !input.contains(" ")) {
                      wv.loadUrl("https://" + input);
                  } else {
                      try {
                          String query = URLEncoder.encode(input, "UTF-8");
                          wv.loadUrl(searchEngineUrl + query);
                      } catch (UnsupportedEncodingException e) {
                          wv.loadUrl(searchEngineUrl + input);
                      }
                  }
              }

              private void purgaTotal() {
                  for (WebView wv : tabList) {
                      wv.clearCache(true);
                      wv.clearHistory();
                      wv.destroy();
                  }
                  tabList.clear();
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  crearNuevaPestana("");
                  etUrl.setText("");
                  homeOverlay.setVisibility(View.VISIBLE);
                  Toast.makeText(this, "🔥 Purga completa: Cookies y caché eliminadas", Toast.LENGTH_SHORT).show();
              }

              private void hideKeyboard() {
                  View view = this.getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
              }

              @Override
              protected void onDestroy() {
                  purgaTotal();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  WebView wv = getCurrentWebView();
                  if (wv != null && wv.canGoBack()) {
                      wv.goBack();
                  } else if (homeOverlay.getVisibility() != View.VISIBLE) {
                      homeOverlay.setVisibility(View.VISIBLE);
                      etUrl.setText("");
                  } else if (tabList.size() > 1) {
                      cerrarPestana(currentTabIndex);
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralBrowser-Instalador
          path: app/build/outputs/apk/debug/*.apk
