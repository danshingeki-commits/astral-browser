          package com.astral.browser;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.SwitchCompat;

          public class SettingsActivity extends AppCompatActivity {

              private SharedPreferences prefs;

              private RadioGroup rgTheme, rgSearchEngine;
              private RadioButton rbThemeCyberpunk, rbThemeAmoled, rbThemeLight;
              private RadioButton rbDuck, rbBrave, rbStartpage;

              private SwitchCompat switchAnimations;
              private SwitchCompat switchBlockTrackers;
              private SwitchCompat switchForceHttps;
              private SwitchCompat switchBlockPopups;
              private SwitchCompat switchDesktopMode;
              private SwitchCompat switchBlockImages;

              private SwitchCompat switchProxy;
              private EditText etProxyHost, etProxyPort;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_settings);

                  prefs = getSharedPreferences("astral_settings", MODE_PRIVATE);

                  rgTheme = findViewById(R.id.rgTheme);
                  rbThemeCyberpunk = findViewById(R.id.rbThemeCyberpunk);
                  rbThemeAmoled = findViewById(R.id.rbThemeAmoled);
                  rbThemeLight = findViewById(R.id.rbThemeLight);

                  switchAnimations = findViewById(R.id.switchAnimations);
                  switchBlockTrackers = findViewById(R.id.switchBlockTrackers);
                  switchForceHttps = findViewById(R.id.switchForceHttps);
                  switchBlockPopups = findViewById(R.id.switchBlockPopups);
                  switchDesktopMode = findViewById(R.id.switchDesktopMode);
                  switchBlockImages = findViewById(R.id.switchBlockImages);

                  rgSearchEngine = findViewById(R.id.rgSearchEngine);
                  rbDuck = findViewById(R.id.rbDuck);
                  rbBrave = findViewById(R.id.rbBrave);
                  rbStartpage = findViewById(R.id.rbStartpage);

                  switchProxy = findViewById(R.id.switchProxy);
                  etProxyHost = findViewById(R.id.etProxyHost);
                  etProxyPort = findViewById(R.id.etProxyPort);

                  Button btnClearData = findViewById(R.id.btnClearData);
                  Button btnBackSettings = findViewById(R.id.btnBackSettings);
                  Button btnSaveSettings = findViewById(R.id.btnSaveSettings);

                  cargar();

                  btnClearData.setOnClickListener(v -> {
                      CookieManager.getInstance().removeAllCookies(null);
                      CookieManager.getInstance().flush();
                      Toast.makeText(this, "Cookies y memoria purgadas", Toast.LENGTH_SHORT).show();
                  });

                  btnBackSettings.setOnClickListener(v -> finish());
                  btnSaveSettings.setOnClickListener(v -> guardar());
              }

              private void cargar() {
                  int theme = prefs.getInt("theme_mode", 0);
                  if (theme == 1) rbThemeAmoled.setChecked(true);
                  else if (theme == 2) rbThemeLight.setChecked(true);
                  else rbThemeCyberpunk.setChecked(true);

                  switchAnimations.setChecked(prefs.getBoolean("enable_animations", true));
                  switchBlockTrackers.setChecked(prefs.getBoolean("block_trackers", true));
                  switchForceHttps.setChecked(prefs.getBoolean("force_https", true));
                  switchBlockPopups.setChecked(prefs.getBoolean("block_popups", true));
                  switchDesktopMode.setChecked(prefs.getBoolean("desktop_mode", false));
                  switchBlockImages.setChecked(prefs.getBoolean("block_images", false));

                  int engine = prefs.getInt("search_engine", 1);
                  if (engine == 0) rbDuck.setChecked(true);
                  else if (engine == 2) rbStartpage.setChecked(true);
                  else rbBrave.setChecked(true);

                  switchProxy.setChecked(prefs.getBoolean("proxy_enabled", false));
                  etProxyHost.setText(prefs.getString("proxy_host", ""));
                  etProxyPort.setText(prefs.getString("proxy_port", ""));
              }

              private void guardar() {
                  int theme = 0;
                  if (rbThemeAmoled.isChecked()) theme = 1;
                  else if (rbThemeLight.isChecked()) theme = 2;

                  int engine = 1;
                  if (rbDuck.isChecked()) engine = 0;
                  else if (rbStartpage.isChecked()) engine = 2;

                  prefs.edit()
                          .putInt("theme_mode", theme)
                          .putBoolean("enable_animations", switchAnimations.isChecked())
                          .putBoolean("block_trackers", switchBlockTrackers.isChecked())
                          .putBoolean("force_https", switchForceHttps.isChecked())
                          .putBoolean("block_popups", switchBlockPopups.isChecked())
                          .putBoolean("desktop_mode", switchDesktopMode.isChecked())
                          .putBoolean("block_images", switchBlockImages.isChecked())
                          .putInt("search_engine", engine)
                          .putBoolean("proxy_enabled", switchProxy.isChecked())
                          .putString("proxy_host", etProxyHost.getText().toString().trim())
                          .putString("proxy_port", etProxyPort.getText().toString().trim())
                          .apply();

                  Toast.makeText(this, "Ajustes y Escudos aplicados", Toast.LENGTH_SHORT).show();
                  finish();
              }
          }
