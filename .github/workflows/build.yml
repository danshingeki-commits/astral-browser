name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="Astral Browser"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0B0813</item>
                  <item name="android:statusBarColor">#110B1F</item>
              </style>
          </resources>
          EOF

          # 6. Interfaz grafica activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0813"
              android:fitsSystemWindows="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:background="#110B1F"
                  android:padding="6dp"
                  android:gravity="center_vertical">

                  <Button
                      android:id="@+id/btnBack"
                      android:layout_width="36dp"
                      android:layout_height="38dp"
                      android:text="‹"
                      android:textSize="20sp"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnForward"
                      android:layout_width="36dp"
                      android:layout_height="38dp"
                      android:text="›"
                      android:textSize="20sp"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnRefresh"
                      android:layout_width="36dp"
                      android:layout_height="38dp"
                      android:text="↻"
                      android:textSize="18sp"
                      android:textColor="#94A3B8"
                      android:background="?android:attr/selectableItemBackground" />

                  <EditText
                      android:id="@+id/etUrl"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="#1A132C"
                      android:textColor="#F8FAFC"
                      android:textColorHint="#64748B"
                      android:hint="DuckDuckGo o URL..."
                      android:textSize="12sp"
                      android:paddingHorizontal="10dp"
                      android:singleLine="true"
                      android:imeOptions="actionGo"
                      android:inputType="textUri" />

                  <Button
                      android:id="@+id/btnSearch"
                      android:layout_width="38dp"
                      android:layout_height="38dp"
                      android:text="🔍"
                      android:textSize="14sp"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnBurn"
                      android:layout_width="38dp"
                      android:layout_height="38dp"
                      android:text="🔥"
                      android:textSize="16sp"
                      android:background="?android:attr/selectableItemBackground" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:visibility="gone" />

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#0B0813" />
          </LinearLayout>
          EOF

          # 7. MainActivity.java (Logica privada y motor web)
          cat << 'EOF' > app/src/main/java/com/astral/browser/MainActivity.java
          package com.astral.browser;

          import android.annotation.SuppressLint;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.UnsupportedEncodingException;
          import java.net.URLEncoder;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;
              private EditText etUrl;
              private ProgressBar progressBar;
              private final String HOME_URL = "https://duckduckgo.com";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  etUrl = findViewById(R.id.etUrl);
                  progressBar = findViewById(R.id.progressBar);

                  Button btnBack = findViewById(R.id.btnBack);
                  Button btnForward = findViewById(R.id.btnForward);
                  Button btnRefresh = findViewById(R.id.btnRefresh);
                  Button btnSearch = findViewById(R.id.btnSearch);
                  Button btnBurn = findViewById(R.id.btnBurn);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setSaveFormData(false);
                  settings.setDatabaseEnabled(false);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, false);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          etUrl.setText(url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          etUrl.setText(url);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });

                  btnBack.setOnClickListener(v -> {
                      if (webView.canGoBack()) webView.goBack();
                  });

                  btnForward.setOnClickListener(v -> {
                      if (webView.canGoForward()) webView.goForward();
                  });

                  btnRefresh.setOnClickListener(v -> webView.reload());
                  btnSearch.setOnClickListener(v -> loadUrlFromInput());

                  etUrl.setOnEditorActionListener((TextView v, int actionId, KeyEvent event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_SEARCH ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          loadUrlFromInput();
                          return true;
                      }
                      return false;
                  });

                  btnBurn.setOnClickListener(v -> destroySession());
                  webView.loadUrl(HOME_URL);
              }

              private void loadUrlFromInput() {
                  String input = etUrl.getText().toString().trim();
                  hideKeyboard();
                  if (input.isEmpty()) {
                      webView.loadUrl(HOME_URL);
                      return;
                  }

                  if (input.startsWith("http://") || input.startsWith("https://")) {
                      webView.loadUrl(input);
                  } else if (input.contains(".") && !input.contains(" ")) {
                      webView.loadUrl("https://" + input);
                  } else {
                      try {
                          String query = URLEncoder.encode(input, "UTF-8");
                          webView.loadUrl("https://duckduckgo.com/?q=" + query);
                      } catch (UnsupportedEncodingException e) {
                          webView.loadUrl("https://duckduckgo.com/?q=" + input);
                      }
                  }
              }

              private void destroySession() {
                  webView.clearCache(true);
                  webView.clearHistory();
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  webView.loadUrl(HOME_URL);
                  etUrl.setText("");
                  Toast.makeText(this, "🔥 Rastro destruido: Cookies y caché eliminadas", Toast.LENGTH_SHORT).show();
              }

              private void hideKeyboard() {
                  View view = this.getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # Guardar los archivos generados en el repositorio
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle app/
          git commit -m "Arquitectura nativa Android de Astral Browser" || true
          git push || true

      - name: Compilar APK con Gradle
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleRelease

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralBrowser-Instalador
          path: app/build/outputs/apk/release/*.apk
