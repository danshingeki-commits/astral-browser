name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/drawable

          # Descarga de imagen oficial de Hatsune Miku
          curl -L -s -A "Mozilla/5.0" -o app/src/main/res/drawable/miku_avatar.png "https://upload.wikimedia.org/wikipedia/en/thumb/1/1e/Hatsune_Miku_V4x.png/440px-Hatsune_Miku_V4x.png" || true

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 14
                  versionName "2.3"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:label="Configuracion" />
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Astral Browser</string>
              <string name="url_hint">Buscar o escribir URL...</string>
          </resources>
          EOF

          # 7. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#090610</item>
                  <item name="android:statusBarColor">#0D0819</item>
                  <item name="android:navigationBarColor">#090610</item>
                  <item name="colorPrimary">#38BDF8</item>
              </style>
          </resources>
          EOF

          # 8. RECURSOS LIQUID GLASS (Degradados vidriados y bordes reflectantes)
          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_bar.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="#B31A122A"
                  android:endColor="#80100A1C"
                  android:angle="90" />
              <corners android:radius="26dp" />
              <stroke
                  android:width="1.2dp"
                  android:color="#4DFFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_input.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#4D1F1435" />
              <corners android:radius="18dp" />
              <stroke
                  android:width="1dp"
                  android:color="#33C084FC" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_liquid_glass_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#66130B24" />
              <corners android:radius="12dp" />
              <stroke
                  android:width="0.8dp"
                  android:color="#3338BDF8" />
          </shape>
          EOF

          # 9. Animacion de levitacion suave para Miku
          cat << 'EOF' > app/src/main/res/anim/floating_anim.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <translate
                  android:fromYDelta="0%p"
                  android:toYDelta="-3.5%p"
                  android:duration="1800"
                  android:repeatCount="infinite"
                  android:repeatMode="reverse" />
          </set>
          EOF

          # 10. Vectorial de respaldo Miku
          cat << 'EOF' > app/src/main/res/drawable/ic_miku_fallback.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="160dp"
              android:height="160dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#150E24" android:pathData="M50,10 A40,40 0 1,0 50,90 A40,40 0 1,0 50,10 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M22,25 C16,42 16,72 23,82 C26,68 30,50 36,36 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M78,25 C84,42 84,72 77,82 C74,68 70,50 64,36 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M34,22 C44,14 56,14 66,22 C62,34 38,34 34,22 Z" />
              <path android:fillColor="#FFDFC4" android:pathData="M36,30 C36,48 64,48 64,30 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M43,36 A2.5,2.5 0 1,1 43,35.9 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M57,36 A2.5,2.5 0 1,1 57,35.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M30,30 A4,4 0 1,1 30,29.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M70,30 A4,4 0 1,1 70,29.9 Z" />
          </vector>
          EOF

          # 11. activity_main.xml con Liquid Glass y Barra Telegram completa
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/mainRootLayout"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#090610">

              <!-- BARRA DE PESTAÑAS VIDRIADA -->
              <LinearLayout
                  android:id="@+id/tabsTopBar"
                  android:layout_width="match_parent"
                  android:layout_height="40dp"
                  android:orientation="horizontal"
                  android:background="#B30E0919"
                  android:paddingLeft="8dp"
                  android:paddingRight="8dp"
                  android:gravity="center_vertical">

                  <HorizontalScrollView
                      android:layout_width="0dp"
                      android:layout_height="match_parent"
                      android:layout_weight="1"
                      android:scrollbars="none">

                      <LinearLayout
                          android:id="@+id/tabsContainer"
                          android:layout_width="wrap_content"
                          android:layout_height="match_parent"
                          android:orientation="horizontal"
                          android:gravity="center_vertical" />
                  </HorizontalScrollView>

                  <Button
                      android:id="@+id/btnTabCounter"
                      android:layout_width="36dp"
                      android:layout_height="32dp"
                      android:text="1"
                      android:textSize="12sp"
                      android:textColor="#38BDF8"
                      android:textStyle="bold"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnNewTab"
                      android:layout_width="34dp"
                      android:layout_height="34dp"
                      android:text="+"
                      android:textSize="18sp"
                      android:textColor="#38BDF8"
                      android:background="?android:attr/selectableItemBackground" />
              </LinearLayout>

              <!-- BARRA DE ESTADO / CHIPS DE CRISTAL -->
              <LinearLayout
                  android:id="@+id/chipsBar"
                  android:layout_width="match_parent"
                  android:layout_height="28dp"
                  android:orientation="horizontal"
                  android:background="#800B0714"
                  android:paddingLeft="10dp"
                  android:paddingRight="10dp"
                  android:gravity="center_vertical">

                  <TextView
                      android:id="@+id/chipProxy"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="PROXY: DIRECTO"
                      android:textColor="#94A3B8"
                      android:textSize="9sp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/bg_liquid_glass_chip"
                      android:layout_marginRight="6dp" />

                  <TextView
                      android:id="@+id/chipShields"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ESCUDOS: ON"
                      android:textColor="#34D399"
                      android:textSize="9sp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/bg_liquid_glass_chip"
                      android:layout_marginRight="6dp" />

                  <TextView
                      android:id="@+id/chipProtocol"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="HTTPS"
                      android:textColor="#38BDF8"
                      android:textSize="9sp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:background="@drawable/bg_liquid_glass_chip" />
              </LinearLayout>

              <!-- BARRA DE ENTRADA URL CRISTAL AHUMADO -->
              <LinearLayout
                  android:id="@+id/urlBar"
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:orientation="horizontal"
                  android:background="#99110B1F"
                  android:paddingLeft="10dp"
                  android:paddingRight="10dp"
                  android:gravity="center_vertical">

                  <EditText
                      android:id="@+id/etUrl"
                      android:layout_width="0dp"
                      android:layout_height="36dp"
                      android:layout_weight="1"
                      android:background="@drawable/bg_liquid_glass_input"
                      android:textColor="#F8FAFC"
                      android:textColorHint="#64748B"
                      android:hint="@string/url_hint"
                      android:textSize="12sp"
                      android:paddingLeft="12dp"
                      android:paddingRight="12dp"
                      android:singleLine="true"
                      android:imeOptions="actionGo"
                      android:inputType="textUri" />

                  <Button
                      android:id="@+id/btnGo"
                      android:layout_width="44dp"
                      android:layout_height="36dp"
                      android:text="Ir"
                      android:textColor="#38BDF8"
                      android:textSize="12sp"
                      android:background="?android:attr/selectableItemBackground" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="2dp"
                  android:visibility="gone" />

              <!-- ÁREA PRINCIPAL -->
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1">

                  <FrameLayout
                      android:id="@+id/webContainer"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="#090610" />

                  <LinearLayout
                      android:id="@+id/homeOverlay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:background="#090610"
                      android:padding="20dp"
                      android:visibility="visible">

                      <ImageView
                          android:id="@+id/ivMiku"
                          android:layout_width="190dp"
                          android:layout_height="230dp"
                          android:scaleType="fitCenter"
                          android:src="@drawable/ic_miku_fallback"
                          android:contentDescription="Hatsune Miku" />

                      <TextView
                          android:id="@+id/tvLogoTitle"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="A S T R A L"
                          android:textColor="#39C5BB"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:letterSpacing="0.25"
                          android:layout_marginTop="14dp" />

                      <TextView
                          android:id="@+id/tvEngineInfo"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Liquid Glass Edition • Sin Rastreo"
                          android:textColor="#64748B"
                          android:textSize="12sp"
                          android:layout_marginTop="4dp" />
                  </LinearLayout>
              </FrameLayout>

              <!-- BARRA INFERIOR LIQUID GLASS ESTILO TELEGRAM -->
              <LinearLayout
                  android:id="@+id/bottomBarContainer"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="#660E0919"
                  android:padding="8dp">

                  <LinearLayout
                      android:id="@+id/telegramStyleBar"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:orientation="horizontal"
                      android:background="@drawable/bg_liquid_glass_bar"
                      android:gravity="center_vertical"
                      android:weightSum="4"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp">

                      <Button
                          android:id="@+id/btnBack"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="1"
                          android:text="‹ Atrás"
                          android:textSize="12sp"
                          android:textColor="#94A3B8"
                          android:background="?android:attr/selectableItemBackground" />

                      <Button
                          android:id="@+id/btnForward"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="1"
                          android:text="Adelante ›"
                          android:textSize="12sp"
                          android:textColor="#94A3B8"
                          android:background="?android:attr/selectableItemBackground" />

                      <Button
                          android:id="@+id/btnRefresh"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="1"
                          android:text="Recargar"
                          android:textSize="12sp"
                          android:textColor="#38BDF8"
                          android:background="?android:attr/selectableItemBackground" />

                      <Button
                          android:id="@+id/btnSettings"
                          android:layout_width="0dp"
                          android:layout_height="match_parent"
                          android:layout_weight="1"
                          android:text="Ajustes"
                          android:textSize="12sp"
                          android:textColor="#C084FC"
                          android:background="?android:attr/selectableItemBackground" />
                  </LinearLayout>
              </LinearLayout>
          </LinearLayout>
          EOF

          # 12. activity_settings.xml
          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/settingsRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090610">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:layout_marginBottom="18dp">

                      <Button
                          android:id="@+id/btnBackSettings"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:text="‹"
                          android:textSize="22sp"
                          android:textColor="#C084FC"
                          android:background="?android:attr/selectableItemBackground" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Configuracion de Astral"
                          android:textColor="#F8FAFC"
                          android:textSize="18sp"
                          android:textStyle="bold"
                          android:layout_marginLeft="8dp" />
                  </LinearLayout>

                  <!-- APARIENCIA -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="APARIENCIA Y ANIMACIONES"
                      android:textColor="#C084FC"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#150E24"
                      android:padding="12dp"
                      android:layout_marginBottom="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Tema Visual:"
                          android:textColor="#94A3B8"
                          android:textSize="12sp"
                          android:layout_marginBottom="6dp" />

                      <RadioGroup
                          android:id="@+id/rgTheme"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginBottom="8dp">

                          <RadioButton
                              android:id="@+id/rbThemeCyberpunk"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Oscuro Cyberpunk (Liquid Glass)"
                              android:textColor="#F8FAFC"
                              android:textSize="12sp" />

                          <RadioButton
                              android:id="@+id/rbThemeAmoled"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Negro Puro AMOLED (Ahorro de bateria)"
                              android:textColor="#F8FAFC"
                              android:textSize="12sp" />

                          <RadioButton
                              android:id="@+id/rbThemeLight"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:text="Tema Claro"
                              android:textColor="#F8FAFC"
                              android:textSize="12sp" />
                      </RadioGroup>

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchAnimations"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Animacion Flotante de Miku"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp" />
                  </LinearLayout>

                  <!-- ESCUDOS BRAVE -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ESCUDOS ASTRAL (BRAVE SHIELDS)"
                      android:textColor="#38BDF8"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#150E24"
                      android:padding="12dp"
                      android:layout_marginBottom="16dp">

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchBlockTrackers"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Bloquear Rastreadores y Cookies Cruzadas"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp" />

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchForceHttps"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Forzar Conexiones Seguras HTTPS"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp"
                          android:layout_marginTop="10dp" />

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchBlockPopups"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Bloquear Ventanas Emergentes (Pop-ups)"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp"
                          android:layout_marginTop="10dp" />

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchDesktopMode"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Sitio para Computadora por Defecto"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp"
                          android:layout_marginTop="10dp" />

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchBlockImages"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Bloquear Imagenes (Ahorro de Datos)"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp"
                          android:layout_marginTop="10dp" />
                  </LinearLayout>

                  <!-- CONEXION Y PROXY -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="RED Y SERVIDOR PROXY"
                      android:textColor="#34D399"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#150E24"
                      android:padding="12dp"
                      android:layout_marginBottom="16dp">

                      <androidx.appcompat.widget.SwitchCompat
                          android:id="@+id/switchProxy"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Enrutar por Servidor Proxy"
                          android:textColor="#F8FAFC"
                          android:textSize="13sp" />

                      <EditText
                          android:id="@+id/etProxyHost"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:background="#1C1430"
                          android:textColor="#F8FAFC"
                          android:textColorHint="#64748B"
                          android:hint="Host / IP (ej. 127.0.0.1)"
                          android:textSize="12sp"
                          android:paddingLeft="10dp"
                          android:paddingRight="10dp"
                          android:layout_marginTop="10dp"
                          android:singleLine="true" />

                      <EditText
                          android:id="@+id/etProxyPort"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:background="#1C1430"
                          android:textColor="#F8FAFC"
                          android:textColorHint="#64748B"
                          android:hint="Puerto (ej. 8118, 9050)"
                          android:textSize="12sp"
                          android:inputType="number"
                          android:paddingLeft="10dp"
                          android:paddingRight="10dp"
                          android:layout_marginTop="8dp"
                          android:singleLine="true" />
                  </LinearLayout>

                  <!-- BUSCADOR -->
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="MOTOR DE BUSQUEDA"
                      android:textColor="#F59E0B"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp" />

                  <RadioGroup
                      android:id="@+id/rgSearchEngine"
