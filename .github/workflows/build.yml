          # 12. SettingsActivity.java
          cat << 'EOF' > app/src/main/java/com/astral/browser/SettingsActivity.java
          package com.astral.browser;

          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.appcompat.widget.SwitchCompat;

          public class SettingsActivity extends AppCompatActivity {

              private SharedPreferences prefs;
              private RadioGroup rgSearchEngine;
              private RadioButton rbDuck, rbBrave, rbStartpage;
              private SwitchCompat switchProxy;
              private EditText etProxyHost, etProxyPort;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_settings);

                  prefs = getSharedPreferences("astral_settings", MODE_PRIVATE);

                  rgSearchEngine = findViewById(R.id.rgSearchEngine);
                  rbDuck = findViewById(R.id.rbDuck);
                  rbBrave = findViewById(R.id.rbBrave);
                  rbStartpage = findViewById(R.id.rbStartpage);

                  switchProxy = findViewById(R.id.switchProxy);
                  etProxyHost = findViewById(R.id.etProxyHost);
                  etProxyPort = findViewById(R.id.etProxyPort);

                  Button btnBackSettings = findViewById(R.id.btnBackSettings);
                  Button btnSaveSettings = findViewById(R.id.btnSaveSettings);

                  cargar();

                  btnBackSettings.setOnClickListener(v -> finish());
                  btnSaveSettings.setOnClickListener(v -> guardar());
              }

              private void cargar() {
                  int engine = prefs.getInt("search_engine", 1);
                  if (engine == 0) rbDuck.setChecked(true);
                  else if (engine == 2) rbStartpage.setChecked(true);
                  else rbBrave.setChecked(true);

                  switchProxy.setChecked(prefs.getBoolean("proxy_enabled", false));
                  etProxyHost.setText(prefs.getString("proxy_host", ""));
                  etProxyPort.setText(prefs.getString("proxy_port", ""));
              }

              private void guardar() {
                  int engine = 1;
                  if (rbDuck.isChecked()) engine = 0;
                  else if (rbStartpage.isChecked()) engine = 2;

                  prefs.edit()
                          .putInt("search_engine", engine)
                          .putBoolean("proxy_enabled", switchProxy.isChecked())
                          .putString("proxy_host", etProxyHost.getText().toString().trim())
                          .putString("proxy_port", etProxyPort.getText().toString().trim())
                          .apply();

                  Toast.makeText(this, "Ajustes guardados", Toast.LENGTH_SHORT).show();
                  finish();
              }
          }
          EOF

          # 13. MainActivity.java con retención de pestañas en segundo plano
          cat << 'EOF' > app/src/main/java/com/astral/browser/MainActivity.java
          package com.astral.browser;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.content.Intent;
