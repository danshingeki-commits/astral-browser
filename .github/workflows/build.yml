name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Astral Private</string>
              <string name="btn_back">&lt;</string>
              <string name="btn_forward">&gt;</string>
              <string name="btn_refresh">R</string>
              <string name="btn_incognito_off">Norm</string>
              <string name="btn_incognito_on">Incog</string>
              <string name="btn_burn">Purga</string>
              <string name="url_hint">Buscar en privado o URL...</string>
          </resources>
          EOF

          # 7. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0B0813</item>
                  <item name="android:statusBarColor">#110B1F</item>
              </style>
          </resources>
          EOF

          # 8. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0B0813"
              android:fitsSystemWindows="true">

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:background="#110B1F"
                  android:padding="5dp"
                  android:gravity="center_vertical">

                  <Button
                      android:id="@+id/btnBack"
                      android:layout_width="34dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_back"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnForward"
                      android:layout_width="34dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_forward"
                      android:textColor="#C084FC"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnRefresh"
                      android:layout_width="34dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_refresh"
                      android:textColor="#94A3B8"
                      android:background="?android:attr/selectableItemBackground" />

                  <EditText
                      android:id="@+id/etUrl"
                      android:layout_width="0dp"
                      android:layout_height="38dp"
                      android:layout_weight="1"
                      android:background="#1A132C"
                      android:textColor="#F8FAFC"
                      android:textColorHint="#64748B"
                      android:hint="@string/url_hint"
                      android:textSize="12sp"
                      android:paddingLeft="8dp"
                      android:paddingRight="8dp"
                      android:singleLine="true"
                      android:imeOptions="actionGo"
                      android:inputType="textUri" />

                  <Button
                      android:id="@+id/btnIncognito"
                      android:layout_width="52dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_incognito_off"
                      android:textColor="#94A3B8"
                      android:textSize="11sp"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnTabs"
                      android:layout_width="36dp"
                      android:layout_height="38dp"
                      android:text="1"
                      android:textColor="#38BDF8"
                      android:textStyle="bold"
                      android:background="?android:attr/selectableItemBackground" />

                  <Button
                      android:id="@+id/btnBurn"
                      android:layout_width="48dp"
                      android:layout_height="38dp"
                      android:text="@string/btn_burn"
                      android:textColor="#EF4444"
                      android:textSize="11sp"
                      android:background="?android:attr/selectableItemBackground" />
              </LinearLayout>

              <ProgressBar
                  android:id="@+id/progressBar"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="3dp"
                  android:visibility="gone" />

              <FrameLayout
                  android:id="@+id/webContainer"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:background="#0B0813" />
          </LinearLayout>
          EOF

          # 9. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/astral/browser/MainActivity.java
          package com.astral.browser;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          import java.io.UnsupportedEncodingException;
          import java.net.URLEncoder;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private FrameLayout webContainer;
              private LinearLayout topBar;
              private EditText etUrl;
              private ProgressBar progressBar;
              private Button btnTabs;
              private Button btnIncognito;

              private final List<WebView> tabList = new ArrayList<>();
              private int currentTabIndex = 0;
              private boolean isIncognitoActive = false;
              private final String HOME_URL = "https://duckduckgo.com";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  webContainer = findViewById(R.id.webContainer);
                  topBar = findViewById(R.id.topBar);
                  etUrl = findViewById(R.id.etUrl);
                  progressBar = findViewById(R.id.progressBar);
                  btnTabs = findViewById(R.id.btnTabs);
                  btnIncognito = findViewById(R.id.btnIncognito);

                  Button btnBack = findViewById(R.id.btnBack);
                  Button btnForward = findViewById(R.id.btnForward);
                  Button btnRefresh = findViewById(R.id.btnRefresh);
                  Button btnBurn = findViewById(R.id.btnBurn);

                  crearNuevaPestana(HOME_URL);

                  btnBack.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoBack()) wv.goBack();
                  });

                  btnForward.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null && wv.canGoForward()) wv.goForward();
                  });

                  btnRefresh.setOnClickListener(v -> {
                      WebView wv = getCurrentWebView();
                      if (wv != null) wv.reload();
                  });

                  btnIncognito.setOnClickListener(v -> toggleIncognito());
                  btnTabs.setOnClickListener(v -> mostrarDialogoPestanas());

                  etUrl.setOnEditorActionListener((TextView v, int actionId, KeyEvent event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO || actionId == EditorInfo.IME_ACTION_SEARCH ||
                          (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          navegarDesdeInput();
                          return true;
                      }
                      return false;
                  });

                  btnBurn.setOnClickListener(v -> purgaTotal());
              }

              private void toggleIncognito() {
                  isIncognitoActive = !isIncognitoActive;
                  WebView wv = getCurrentWebView();

                  if (isIncognitoActive) {
                      btnIncognito.setText(R.string.btn_incognito_on);
                      btnIncognito.setTextColor(Color.parseColor("#A855F7"));
                      topBar.setBackgroundColor(Color.parseColor("#1F0A2E"));
                      aplicarAjustesIncognito(wv, true);
                      Toast.makeText(this, "🕶️ Incognito ACTIVO: Cookies bloqueadas y rastreo neutralizado", Toast.LENGTH_SHORT).show();
                  } else {
                      btnIncognito.setText(R.string.btn_incognito_off);
                      btnIncognito.setTextColor(Color.parseColor("#94A3B8"));
                      topBar.setBackgroundColor(Color.parseColor("#110B1F"));
                      aplicarAjustesIncognito(wv, false);
                      Toast.makeText(this, "Modo privado estandar", Toast.LENGTH_SHORT).show();
                  }
                  if (wv != null) wv.reload();
              }

              @SuppressLint("SetJavaScriptEnabled")
              private void aplicarAjustesIncognito(WebView wv, boolean incognito) {
                  if (wv == null) return;
                  WebSettings settings = wv.getSettings();
                  CookieManager cookieManager = CookieManager.getInstance();

                  if (incognito) {
                      settings.setDomStorageEnabled(false);
                      settings.setDatabaseEnabled(false);
                      settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                      cookieManager.setAcceptCookie(false);
                      cookieManager.setAcceptThirdPartyCookies(wv, false);
                      wv.clearCache(true);
                  } else {
                      settings.setDomStorageEnabled(true);
                      settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                      cookieManager.setAcceptCookie(true);
                      cookieManager.setAcceptThirdPartyCookies(wv, false);
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private WebView crearNuevaPestana(String url) {
                  WebView wv = new WebView(this);
                  wv.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  WebSettings settings = wv.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setSaveFormData(false);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(true);
                  settings.setDisplayZoomControls(false);

                  aplicarAjustesIncognito(wv, isIncognitoActive);

                  wv.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (view == getCurrentWebView()) {
                              if (newProgress < 100) {
                                  progressBar.setVisibility(View.VISIBLE);
                                  progressBar.setProgress(newProgress);
                              } else {
                                  progressBar.setVisibility(View.GONE);
                              }
                          }
                      }
                  });

                  wv.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          if (view == getCurrentWebView()) etUrl.setText(url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          if (view == getCurrentWebView()) etUrl.setText(url);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }
                  });

                  wv.loadUrl(url);
                  tabList.add(wv);
                  cambiarAPestana(tabList.size() - 1);
                  return wv;
              }

              private void cambiarAPestana(int index) {
                  if (index < 0 || index >= tabList.size()) return;
                  currentTabIndex = index;
                  webContainer.removeAllViews();
                  WebView current = tabList.get(currentTabIndex);
                  webContainer.addView(current);
                  etUrl.setText(current.getUrl() != null ? current.getUrl() : HOME_URL);
                  btnTabs.setText(String.valueOf(tabList.size()));
              }

              private void cerrarPestana(int index) {
                  if (tabList.size() <= 1) {
                      purgaTotal();
                      return;
                  }
                  WebView wv = tabList.remove(index);
                  wv.clearCache(true);
                  wv.destroy();

                  if (currentTabIndex >= tabList.size()) {
                      currentTabIndex = tabList.size() - 1;
                  }
                  cambiarAPestana(currentTabIndex);
              }

              private void mostrarDialogoPestanas() {
                  List<String> items = new ArrayList<>();
                  for (int i = 0; i < tabList.size(); i++) {
                      String url = tabList.get(i).getUrl();
                      items.add("Pestana " + (i + 1) + ": " + (url != null ? url : "Nueva"));
                  }
                  items.add("➕ Abrir nueva pestana");

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Pestanas Privadas");
                  builder.setItems(items.toArray(new String[0]), (dialog, which) -> {
                      if (which == tabList.size()) {
                          crearNuevaPestana(HOME_URL);
                      } else {
                          cambiarAPestana(which);
                      }
                  });
                  builder.setNeutralButton("Cerrar pestana actual", (dialog, which) -> cerrarPestana(currentTabIndex));
                  builder.show();
              }

              private WebView getCurrentWebView() {
                  if (currentTabIndex >= 0 && currentTabIndex < tabList.size()) {
                      return tabList.get(currentTabIndex);
                  }
                  return null;
              }

              private void navegarDesdeInput() {
                  String input = etUrl.getText().toString().trim();
                  hideKeyboard();
                  WebView wv = getCurrentWebView();
                  if (wv == null) return;

                  if (input.isEmpty()) {
                      wv.loadUrl(HOME_URL);
                      return;
                  }

                  if (input.startsWith("http://") || input.startsWith("https://")) {
                      wv.loadUrl(input);
                  } else if (input.contains(".") && !input.contains(" ")) {
                      wv.loadUrl("https://" + input);
                  } else {
                      try {
                          String query = URLEncoder.encode(input, "UTF-8");
                          wv.loadUrl("https://duckduckgo.com/?q=" + query);
                      } catch (UnsupportedEncodingException e) {
                          wv.loadUrl("https://duckduckgo.com/?q=" + input);
                      }
                  }
              }

              private void purgaTotal() {
                  for (WebView wv : tabList) {
                      wv.clearCache(true);
                      wv.clearHistory();
                      wv.destroy();
                  }
                  tabList.clear();
                  CookieManager.getInstance().removeAllCookies(null);
                  CookieManager.getInstance().flush();
                  crearNuevaPestana(HOME_URL);
                  etUrl.setText("");
                  Toast.makeText(this, "🔥 Purga completa: Cookies, sesiones y cache destruidas", Toast.LENGTH_SHORT).show();
              }

              private void hideKeyboard() {
                  View view = this.getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
              }

              @Override
              protected void onDestroy() {
                  purgaTotal();
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  WebView wv = getCurrentWebView();
                  if (wv != null && wv.canGoBack()) {
                      wv.goBack();
                  } else if (tabList.size() > 1) {
                      cerrarPestana(currentTabIndex);
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          gradle assembleDebug

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: AstralBrowser-Instalador
          path: app/build/outputs/apk/debug/*.apk
