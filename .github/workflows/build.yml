name: Compilar Astral Browser Nativo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Generar codigo nativo Android
        run: |
          mkdir -p app/src/main/java/com/astral/browser
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AstralBrowser"
          include ':app'
          EOF

          # 2. build.gradle raiz
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.astral.browser'
              compileSdk 34

              defaultConfig {
                  applicationId "com.astral.browser"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "1.9"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:label="Configuracion" />
              </application>
          </manifest>
          EOF

          # 6. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Astral Browser</string>
              <string name="url_hint">Ingresar URL o buscar...</string>
          </resources>
          EOF

          # 7. styles.xml
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#090610</item>
                  <item name="android:statusBarColor">#090610</item>
                  <item name="android:navigationBarColor">#0E0919</item>
                  <item name="colorPrimary">#38BDF8</item>
              </style>
          </resources>
          EOF

          # 8. Animacion Miku
          cat << 'EOF' > app/src/main/res/anim/floating_anim.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android"
              android:interpolator="@android:anim/accelerate_decelerate_interpolator">
              <translate
                  android:fromYDelta="0%p"
                  android:toYDelta="-3%p"
                  android:duration="1800"
                  android:repeatCount="infinite"
                  android:repeatMode="reverse" />
          </set>
          EOF

          # 9. Avatar vectorial Miku
          cat << 'EOF' > app/src/main/res/drawable/ic_miku.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="150dp"
              android:height="150dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#150E24" android:pathData="M50,10 A40,40 0 1,0 50,90 A40,40 0 1,0 50,10 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M25,28 C20,40 18,65 24,75 C26,62 30,45 35,35 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M75,28 C80,40 82,65 76,75 C74,62 70,45 65,35 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M35,25 C45,18 55,18 65,25 C60,35 40,35 35,25 Z" />
              <path android:fillColor="#FFDFC4" android:pathData="M38,32 C38,48 62,48 62,32 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M43,38 A2.5,2.5 0 1,1 43,37.9 Z" />
              <path android:fillColor="#39C5BB" android:pathData="M57,38 A2.5,2.5 0 1,1 57,37.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M32,32 A4,4 0 1,1 32,31.9 Z" />
              <path android:fillColor="#EF4444" android:pathData="M68,32 A4,4 0 1,1 68,31.9 Z" />
          </vector>
          EOF

          # 10. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
